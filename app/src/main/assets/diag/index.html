<style>
:root{
  --bg:#0D0C0B;--card:#131110;--card2:#1A1715;--line:#2A2622;--line2:#3A342E;
  --txt:#F3EFEA;--txt2:#CFC8BF;--mut:#A39C94;
  --or:#FF6900;--or2:#FF9A4D;--orbg:#2A1A0E;--ink:#140A02;
  --ok:#4ADE80;--okt:#86EFAC;--okbg:rgba(47,191,113,.12);
  --bad:#F87171;--badt:#FCA5A5;--badbg:rgba(248,113,113,.12);
  --na:#57514B;
  --fb:'Bricolage Grotesque',system-ui,sans-serif;--fu:'DM Sans',system-ui,sans-serif;--fm:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:var(--fu);line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:14px 20px calc(28px + env(safe-area-inset-bottom));position:relative}
.bgmark{position:fixed;right:-120px;top:70px;width:360px;height:360px;opacity:.05;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px;padding:4px 0 14px;position:relative;z-index:1}
.wm{font-family:var(--fb);font-weight:800;font-size:20px;letter-spacing:-.2px;color:#fff}.wm i{font-style:normal;color:var(--or)}
.tag{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

.eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:1.6px;color:var(--or2);text-transform:uppercase}
h1{font-family:var(--fb);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.6px;color:#fff}
h1.xl{font-size:38px;line-height:1.05;letter-spacing:-.8px}
h1.md{font-size:26px}
h2{font-family:var(--fb);font-weight:800;font-size:22px;color:#fff;margin-bottom:8px}
h3{font-family:var(--fm);font-weight:500;font-size:11px;letter-spacing:1.6px;color:var(--or2);text-transform:uppercase;margin:22px 0 8px;display:flex;justify-content:space-between;gap:10px}
h3 span{color:var(--mut);letter-spacing:0}
p{margin-bottom:10px;color:var(--txt2);font-size:15px;line-height:22px}
p b,p strong{color:#fff}
.mut{color:var(--mut);font-size:13.5px}
.mono{font-family:var(--fm)}
.stack{display:flex;flex-direction:column;gap:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}

/* botones */
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:999px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;background:var(--or);color:var(--ink);margin-top:10px;text-decoration:none}
.b:active{transform:scale(.98)}
.b:disabled{opacity:.5}
.b.sec{background:transparent;color:var(--txt);border:1px solid var(--line2);min-height:50px;font-size:15px}
.b.ok{background:var(--txt);color:var(--bg)}
.b.bad{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.b.sm{min-height:44px;width:auto;display:inline-flex;font-size:14px;padding:10px 16px;margin:8px 8px 0 0}
.b small{display:block;font-weight:500;font-size:12.5px;opacity:.75}
.tbody .b{background:var(--orbg);color:var(--or2);border:1px solid rgba(255,105,0,.35);min-height:52px;font-size:15px}
.tbody .b.sec{background:transparent;color:var(--txt);border-color:var(--line2)}
.cta{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;border:0;border-radius:999px;background:var(--or);color:var(--ink);padding:8px 8px 8px 24px;text-align:left;cursor:pointer;margin:16px 0 14px}
.cta:active{transform:scale(.98)}
.cta span{display:flex;flex-direction:column;flex-grow:1}
.cta b{font-size:17px}.cta small{font-size:13px;opacity:.78}
.cta i{width:56px;height:56px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--txt)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.acts .b{margin:0;min-height:54px;font-size:15px}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;text-underline-offset:3px;font-size:14px;display:block;margin:12px auto 0;padding:10px;cursor:pointer}

/* barra superior y progreso */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .t{flex-grow:1;display:flex;flex-direction:column}
.top .t b{font-family:var(--fm);font-weight:400;font-size:12px;color:var(--mut)}
.top .t span{font-size:13px;font-weight:500}
.top .pct{font-family:var(--fm);font-size:13px;color:var(--or2)}
.top h1{font-size:24px;letter-spacing:-.4px}
.segs{display:flex;gap:3px;margin-bottom:22px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.ok{background:var(--or)}.segs i.fail{background:var(--bad)}.segs i.na,.segs i.skip{background:var(--na)}.segs i.cur{background:#FFB77D}
.thead{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tbody{display:flex;flex-direction:column}

/* lecturas */
.big{font-family:var(--fb);font-weight:800;font-size:52px;line-height:1.05;color:#fff;margin:6px 0}
.big small{font-size:22px;color:var(--mut)}
.vals{white-space:pre-line;font-family:var(--fm);font-size:13px;line-height:21px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px;min-height:46px;color:var(--txt)}
.meter{height:12px;background:var(--card2);border-radius:99px;margin-top:16px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or2),var(--or));border-radius:99px;transition:width .08s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px}
.kv>span:nth-child(odd){color:var(--mut)}
.kv>span:nth-child(even){text-align:right;word-break:break-word;font-family:var(--fm);font-size:13.5px}
.tbody>.kv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.tile span{font-size:11.5px;color:var(--mut)}.tile b{font-family:var(--fm);font-weight:500;font-size:16px}
.pills{display:flex;gap:10px;margin-top:14px}
.pill{flex:1;text-align:center;padding:16px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px;transition:.2s}
.pill.on{background:var(--okbg);border-color:rgba(74,222,128,.4);color:var(--okt)}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--or);border-radius:50%;animation:sp 1s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
video{width:100%;max-height:44vh;background:#000;border-radius:18px;margin-top:12px;object-fit:cover}
.pad{height:240px;border:2px dashed var(--line2);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--fm)}
.dot{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,105,0,.4);border:2px solid var(--or);pointer-events:none;z-index:60}

/* veredicto */
.verdict{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px 16px;margin-top:16px;border:1px solid}
.verdict .vi{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.verdict b{display:block;font-size:15px}.verdict small{display:block;font-size:13px;line-height:19px;color:var(--txt2);margin-top:2px}
.verdict.ok{background:rgba(47,191,113,.10);border-color:rgba(74,222,128,.28)}.verdict.ok b{color:var(--okt)}.verdict.ok .vi{background:var(--ok)}
.verdict.fail{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.3)}.verdict.fail b{color:var(--badt)}.verdict.fail .vi{background:var(--bad)}
.verdict.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3)}.verdict.warn b{color:#FCD34D}.verdict.warn .vi{background:#FBBF24}
.verdict.na{background:var(--card2);border-color:var(--line)}.verdict.na b{color:var(--txt2)}.verdict.na .vi{background:var(--na)}

/* pantallas superpuestas */
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000}
.grid{flex:1;display:grid;touch-action:none;user-select:none;-webkit-user-select:none}
.grid i{border:1px solid #1d1a17;background:#0a0908}
.grid i.on{background:var(--or);border-color:var(--or2)}
.ovbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);color:#fff;font-size:14px;font-family:var(--fm)}
.ovbar .b{margin:0}
.color{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px;font-size:13px;font-family:var(--fm)}

/* inicio */
.hero{display:flex;flex-direction:column;gap:4px;margin:4px 0 16px}
.devcard{display:flex;gap:18px;align-items:center}
.ring{position:relative;flex-shrink:0}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font-family:var(--fb);font-weight:800;line-height:1;color:#fff}
.ring .n small{color:var(--mut)}
.ring .l{font-size:10.5px;color:var(--mut);margin-top:3px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;flex-grow:1;min-width:0}
.specs div{display:flex;flex-direction:column;gap:2px;min-width:0}
.specs span{font-size:11px;color:var(--mut)}
.specs b{font-family:var(--fm);font-weight:500;font-size:14px;line-height:18px;overflow-wrap:anywhere}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--txt);text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;background:var(--orbg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .tx{display:flex;flex-direction:column;flex-grow:1;min-width:0}
.row .tx b{font-size:15px}.row .tx span{font-size:12.5px;color:var(--mut)}
.strip{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--line);border-radius:16px;width:100%;background:transparent;color:var(--txt);text-align:left;cursor:pointer;margin-top:4px}
.strip .tx{display:flex;flex-direction:column;flex-grow:1}
.strip .tx b{font-size:13.5px;font-weight:500}.strip .tx span{font-family:var(--fm);font-size:11.5px;color:var(--mut)}
.strip em{font-style:normal;font-size:13px;color:var(--or2);font-weight:500}
.gsq{border-radius:10px;font-family:var(--fb);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gsq.A{background:var(--okbg);color:var(--ok)}.gsq.B{background:var(--orbg);color:var(--or2)}.gsq.C{background:var(--badbg);color:var(--bad)}
.warn{display:inline-flex;gap:6px;align-items:center;font-family:var(--fm);font-size:11.5px;color:#FBBF24;border:1px solid rgba(251,191,36,.35);border-radius:999px;padding:4px 10px;margin-top:10px}
input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:13px 14px;font-size:16px;margin-top:6px;font-family:var(--fm)}
input:focus{outline:2px solid var(--or);border-color:transparent}
label{display:block;font-size:12.5px;color:var(--mut);margin-top:12px}

/* resultado */
.gradebox{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.counts div{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.counts b{font-family:var(--fm);font-weight:500;font-size:20px}.counts span{font-size:12px;color:var(--txt2)}
.counts .c1{background:var(--okbg)}.counts .c1 b{color:var(--okt)}
.counts .c2{background:var(--badbg)}.counts .c2 b{color:var(--badt)}
.counts .c3{background:var(--card2)}.counts .c3 b{color:var(--txt2)}.counts .c3 span{color:var(--mut)}
.fixl{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 16px;margin-bottom:12px}
.fx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx .ic{width:34px;height:34px;border-radius:10px;background:var(--badbg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fx .tx{display:flex;flex-direction:column}.fx .tx b{font-size:14.5px}.fx .tx span{font-size:12.5px;color:var(--mut)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin:6px 0 16px}
.cats div{display:flex;flex-direction:column;gap:5px}
.cats p{display:flex;justify-content:space-between;font-size:12.5px;margin:0;color:var(--txt)}
.cats p span{font-family:var(--fm);color:var(--mut)}
.cats u{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;text-decoration:none}
.cats u i{display:block;height:100%;border-radius:3px}
details{margin-bottom:12px}
details summary{cursor:pointer;color:var(--or2);font-size:14px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}

/* lista de pruebas */
.filters{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:transparent;color:var(--txt);font-weight:500;font-size:13.5px;cursor:pointer;min-height:40px}
.chipb.on{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:700}
.tl{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tr{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;background:transparent;border:0;border-bottom:1px solid #221E1B;color:var(--txt);font-size:14.5px;text-align:left;cursor:pointer;min-height:50px}
.tr:last-child{border-bottom:0}
.tr .d{width:8px;height:8px;border-radius:999px;background:var(--line);flex-shrink:0}
.tr .n{flex-grow:1}
.tr .d.ok{background:var(--ok)}.tr .d.fail{background:var(--bad)}.tr .d.na,.tr .d.skip{background:var(--na)}
.stp{font-family:var(--fm);font-size:11.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;color:var(--or2);background:var(--orbg)}
.stp.ok{color:var(--okt);background:var(--okbg)}.stp.fail{color:var(--badt);background:var(--badbg)}.stp.na,.stp.skip{color:var(--mut);background:var(--card2)}
.res small{display:block;color:var(--mut);font-size:12px}
.dock{position:sticky;bottom:0;padding:34px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,12,11,0),var(--bg) 45%);margin-top:6px}

/* historial y ficha */
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;color:var(--txt);text-align:left}
.hist:last-child{border-bottom:0}
.hist .tx{display:flex;flex-direction:column}.hist .tx b{font-size:15px}.hist .tx span{font-family:var(--fm);font-size:11.5px;color:var(--mut)}
.sl{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.sl:last-child{border:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;z-index:90;max-width:90vw}
footer{text-align:center;color:var(--na);font-size:12px;margin-top:24px;font-family:var(--fm)}
.fade{animation:fd .25s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
/* ===================== Diagnóstico MiVibra v2 ===================== */
// MiVibra — software de diagnóstico y optimización

const N = window.Android || null;      // puente nativo (solo dentro del APK)
const APP = !!N;
const q = s => document.querySelector(s);
// $ nunca devuelve null: si la prueba ya terminó y su elemento no existe, las escrituras se ignoran
const NOOP = new Proxy(function(){}, { get: (t, k) => k === 'classList' ? { add(){}, remove(){} } : k === 'style' ? {} : k === 'remove' || k === 'addEventListener' ? () => {} : undefined, set: () => true });

  if (!APP) return Promise.resolve(true);

    const id = (permSeq = permSeq % 800 + 1);

const SOC = {

function socName(i){
  const codes = [i.socModel, i.socProp, i.platform, i.hardware, i.cpuHw].filter(c => c && c !== 'unknown');
  const keys = Object.keys(SOC);
  for (const c of codes) {

/* ---------- estado ---------- */
const S = { offs:[], onResume:null, filter:'all', info:{}, feat:{}, bat:null, R:{}, imei:'', model:'', ctx:null, cancel:null, page:'home', runId:0, saved:false };

async function loadDevice(){
  if (APP) {
    S.info = callJ('deviceInfo') || {};

function icon(k, color, size, sw){
  return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (IC[k] || '') + '</svg>';
}
function ringSvg(pct, size, stroke, color, inner, label){
  const r = (size - stroke) / 2 - 2, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pct || 0)) / 100 * c;
  return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px"><svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + esc(label || '') + '">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#1E1A17" stroke-width="' + stroke + '"/>' +
    (v > 0 ? '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + v.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' : '') +
    '</svg><div class="in">' + inner + '</div></div>';
}
const GCOL = { A:'#4ADE80', B:'#FF9A4D', C:'#F87171' };

/* ---------- motor de pruebas ---------- */
function catPos(t){ const list = T.filter(x => x.cat === t.cat); return (list.indexOf(t) + 1) + ' de ' + list.length; }
function progressHead(t, auto){
  const c = S.ctx;
  if (!c || !c.full) {
    return '<div class="top"><button class="ib" data-x="cancel" aria-label="Volver">' + icon('back') + '</button><span class="eyebrow" style="flex-grow:1">' + esc(t.cat) + '</span></div>';
  }
  const pct = Math.round(c.i / c.total * 100), left = Math.max(1, Math.round((c.total - c.i) * 20 / 60));
  const segs = T.map((x, k) => { const r = S.R[x.id]; return '<i class="' + (r ? r.st : (k === c.i ? 'cur' : '')) + '"></i>'; }).join('');
  return '<div class="top"><button class="ib" data-x="cancel" aria-label="Salir del diagnóstico">' + icon('close') + '</button>' +
    '<div class="t"><b>PRUEBA ' + String(c.i + 1).padStart(2, '0') + ' / ' + c.total + '</b><span>' + (auto ? 'Automática · no tienes que hacer nada' : 'Faltan unos ' + left + ' min') + '</span></div>' +
    '<span class="pct">' + pct + ' %</span></div><div class="segs" aria-hidden="true">' + segs + '</div>';
}

/* step(t, html, setup, opts)
   setup(fin, ready) → cleanup?   fin(st, note) termina   ready(st, note) muestra veredicto + Continuar
   opts.labels = [ok, fail]   opts.auto = true (sin botones manuales)   opts.extra = [{label, st, note}] */
function step(t, html, setup, o){
  o = o || {};
  const L = (o.labels || ['Funciona', 'No funciona']).map(x => x.replace(/^[✓✗]\s*/, ''));
  const full = S.ctx && S.ctx.full;
  return new Promise(res => {
    stage.innerHTML = progressHead(t, o.auto) +
      '<div class="fade"><div class="thead"><span class="eyebrow">' + esc(t.cat) + ' · ' + catPos(t) + '</span><h1>' + esc(t.name) + '</h1></div>' +
      '<div class="tbody">' + html + '</div><div id="vd"></div>' +
      (o.auto ? '' : '<div class="acts" id="man"><button class="b bad" data-r="fail">' + icon('close', '#F87171', 18, 2.4) + L[1] + '</button><button class="b ok" data-r="ok">' + icon('check', '#15803D', 18, 2.6) + L[0] + '</button></div>') +
      (o.extra || []).map((x, k) => '<button class="b sec" data-e="' + k + '">' + x.label + '</button>').join('') +
      '<button class="lnk" data-r="skip">' + (full ? 'Omitir esta prueba' : 'Cancelar') + '</button></div>';
    window.scrollTo(0, 0);
    let done = false, clean = null;
    const fin = (st, note) => {
      if (done) return; done = true; S.cancel = null;
      try { clean && clean(); } catch (e) {}
      res(st == null ? null : { st: st, note: note || '' });
    };
    const ready = (st, note, lvl) => {
      if (done) return;
      const k = lvl || st;
      const lab = { ok:'Funciona correctamente', warn:'Funciona, con advertencias', fail:'Se detectó una falla', na:'No aplica en este equipo' }[k] || '';
      const ic = { ok:icon('check', '#06210F', 16, 3), warn:icon('warn', '#2A1A02', 15, 2.6), fail:icon('close', '#2A0606', 16, 3), na:icon('close', '#0D0C0B', 14, 3) }[k] || '';
      $('#vd').innerHTML = '<div class="verdict ' + k + ' fade"><span class="vi">' + ic + '</span><span><b>' + lab + '</b>' + (note ? '<small>' + esc(note) + '</small>' : '') + '</span></div>' +
        '<button class="b" id="cont">Continuar' + icon('arrow', '#140A02', 18, 2.4) + '</button>';
      const m = q('#man'); if (m) m.style.display = 'none';
      $('#cont').onclick = () => fin(st, note);
    };
    S.cancel = () => fin(full ? 'skip' : null);
    stage.querySelectorAll('[data-r]').forEach(b => b.onclick = () => fin(b.dataset.r === 'skip' && !full ? null : b.dataset.r));
    stage.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const x = o.extra[+b.dataset.e]; fin(x.st, x.note); });
    const xb = stage.querySelector('[data-x="cancel"]'); if (xb) xb.onclick = () => window.__back();
    if (setup) { try { clean = setup(fin, ready) || null; } catch (e) { fin('fail', 'Error: ' + e.message); } }
  });
}

// Pantalla táctil por cuadrícula
function tTouch(t){
  return step(t, '<p>Pasa el dedo por <b>todos</b> los cuadros hasta pintarlos de naranja, incluidos los bordes. Si alguna zona no se pinta, el táctil tiene fallas.</p><button class="b" id="go">Iniciar prueba táctil</button>', fin => {
    let ov = null;
    $('#go').onclick = () => {
      const cols = 7, rows = Math.max(10, Math.round(cols * innerHeight / innerWidth)), total = cols * rows;
      ov = document.createElement('div'); ov.className = 'ov';
      ov.innerHTML = '<div class="grid" style="grid-template-columns:repeat(' + cols + ',1fr);grid-template-rows:repeat(' + rows + ',1fr)">' + '<i></i>'.repeat(total) + '</div>' +
        '<div class="ovbar"><span id="tc">0/' + total + '</span><button class="b bad sm" id="tf">Hay zonas que no responden</button></div>';
      document.body.appendChild(ov);
      const grid = ov.querySelector('.grid'), tc = ov.querySelector('#tc');
      let n = 0;
      const close = () => { if (ov) { ov.remove(); ov = null; } };
      const hit = (x, y) => {
        const el = document.elementFromPoint(x, y);
        if (el && el.tagName === 'I' && el.parentNode === grid && !el.classList.contains('on')) {
          el.classList.add('on'); n++; tc.textContent = n + '/' + total;
          if (n === total) { vibrate([60]); setTimeout(() => { close(); fin('ok', 'Toda la superficie responde'); }, 250); }
        }
      };
      const tm = e => { e.preventDefault(); for (const p of e.changedTouches) hit(p.clientX, p.clientY); };
      grid.addEventListener('touchstart', tm, { passive: false });
      grid.addEventListener('touchmove', tm, { passive: false });
      grid.addEventListener('mousemove', e => { if (e.buttons) hit(e.clientX, e.clientY); });
      grid.addEventListener('mousedown', e => hit(e.clientX, e.clientY));
      ov.querySelector('#tf').onclick = () => { close(); fin('fail', (total - n) + ' de ' + total + ' zonas sin respuesta'); };
    };
    return () => { if (ov) ov.remove(); };
  });
}

// Multitáctil
function tMulti(t){
  return step(t, '<p>Apoya <b>todos los dedos que puedas</b> al mismo tiempo dentro del recuadro.</p><div class="pad" id="pad"><span id="pt">Toca aquí</span></div>', fin => {
    const pad = $('#pad'); let max = 0, dots = [], tmr = 0;
    const draw = e => {
      e.preventDefault();
      dots.forEach(d => d.remove()); dots = [];
      for (const p of e.touches) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = p.clientX + 'px'; d.style.top = p.clientY + 'px'; document.body.appendChild(d); dots.push(d); }
      if (e.touches.length > max) { max = e.touches.length; clearTimeout(tmr); if (max >= 3) tmr = setTimeout(() => fin('ok', 'Detecta ' + max + ' toques simultáneos'), 1400); }
      $('#pt').textContent = e.touches.length + ' dedo(s) · máximo ' + max;
    };
    ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => pad.addEventListener(ev, draw, { passive: false }));
    return () => { clearTimeout(tmr); dots.forEach(d => d.remove()); };
  });
}

const HEALTH = { 1:'Desconocida', 2:'Buena', 3:'Sobrecalentada', 4:'Agotada', 5:'Sobrevoltaje', 6:'Falla', 7:'Fría' };
const PLUG = { 0:'Sin conectar', 1:'Cargador de pared', 2:'USB', 4:'Inalámbrico', 8:'Base' };

// Batería (nativo: salud, temperatura, capacidad)
const HSRC = { system:'Dato del sistema Android', fuelgauge:'Medidor interno del equipo', capacity:'Capacidad medida vs. de fábrica', estimate:'Estimación de la app (±8 %)' };
function healthText(b){
  if (!b || !b.healthPct) return '';
  return b.healthSrc === 'estimate' ? b.healthLo + '–' + b.healthHi + ' % (estimado)' : b.healthPct + ' %';
}
/* Criterios estrictos: capacidad, estado reportado, voltaje, temperatura y ciclos */
function batteryVerdict(b){
  const bad = [], warn = [], info = [];
  if ([3, 4, 5, 6].includes(b.health)) bad.push('El sistema reporta: ' + HEALTH[b.health].toLowerCase());
  if (b.health === 7) warn.push('Batería fría');
  const v = b.voltage > 100 ? b.voltage / 1000 : b.voltage;
  if (v > 0) {
    if (v > 4.5) bad.push('Sobrevoltaje (' + v.toFixed(2) + ' V)');
    else if (b.level >= 20 && v < 3.45) bad.push('Voltaje de ' + v.toFixed(2) + ' V con ' + b.level + ' % de carga: posible celda dañada');
    else if (b.level >= 90 && v < 3.9 && !b.plugged) warn.push('Voltaje bajo para ' + b.level + ' % de carga (' + v.toFixed(2) + ' V)');
  }
  if (b.temp >= 45) bad.push('Temperatura alta (' + b.temp + ' °C)');
  else if (b.temp >= 40) warn.push('Temperatura elevada (' + b.temp + ' °C)');
  if (b.cycles >= 1000) bad.push(b.cycles + ' ciclos: vida útil cumplida');
  else if (b.cycles >= 600) warn.push(b.cycles + ' ciclos de carga');
  const h = b.healthPct;
  if (h) {
    if (b.healthSrc === 'estimate') {
      const r = b.healthLo + '–' + b.healthHi + ' %';
      if (b.healthHi < 80) bad.push('Capacidad estimada ' + r);
      else if (b.healthLo < 80) warn.push('Capacidad estimada ' + r + ': sin el dato del sistema no se puede confirmar');
      else info.push('Capacidad estimada ' + r);
    } else {
      if (h < 80) bad.push('Capacidad ' + h + ' %: por debajo del mínimo recomendado (80 %)');
      else if (h < 85) warn.push('Capacidad ' + h + ' %: desgaste avanzado');
      else info.push('Capacidad ' + h + ' %' + (h >= 90 ? ': excelente' : ': desgaste normal'));
    }
  } else warn.push('El equipo no entrega datos de capacidad');
  return { st: bad.length ? 'fail' : 'ok', level: bad.length ? 'fail' : warn.length ? 'warn' : 'ok', note: bad.concat(warn, info).join(' · ') };
}
function tBattery(t){
  if (!APP) {
    return step(t, '<div class="big" id="bl">—</div><p class="mut">Para medir la salud real de la batería instala la app MiVibra.</p><p>¿La batería dura lo normal y no se apaga sola con carga?</p>', () => {
      if (navigator.getBattery) navigator.getBattery().then(b => { $('#bl').textContent = Math.round(b.level * 100) + '%'; }).catch(() => {});
    }, { labels: ['Dura bien', 'Se descarga rápido'] });
  }
  return step(t, '<div id="bring" style="display:flex;justify-content:center;margin:4px 0 14px"><div class="spin"></div></div><div class="kv" id="bk"></div><div id="bsrc"></div>', (fin, ready) => {
    setTimeout(() => {
      const b = callJ('batteryDeep') || {};
      S.bat = b;
      const est = b.healthSrc === 'estimate', h = b.healthPct;
      const col = !h ? '#57514B' : (est ? b.healthHi : h) < 80 ? '#F87171' : (est ? b.healthLo : h) < 85 ? '#FBBF24' : '#FF6900';
      $('#bring').innerHTML = ringSvg(h || 0, 200, 14, col,
        '<span class="n" style="font-size:52px">' + (h ? (est ? '~' : '') + h : '—') + '<small style="font-size:22px">%</small></span><span class="l" style="font-size:12.5px">' + (est ? b.healthLo + '–' + b.healthHi + ' % estimado' : h ? 'capacidad máxima' : 'sin datos de capacidad') + '</span>', 'Capacidad ' + (h || 0) + ' por ciento');
      const vv = b.voltage > 100 ? b.voltage / 1000 : b.voltage;
      const rows = [
        ['Fuente del dato', h ? HSRC[b.healthSrc] : 'No disponible'],
        ['Capacidad de fábrica', b.designMah ? b.designMah + ' mAh' : 'No disponible'],
        ['Capacidad actual', b.fullMah ? (est ? '≈ ' : '') + b.fullMah + ' mAh' : 'No disponible'],
        ['Ciclos de carga', b.cycles >= 0 ? b.cycles : 'No disponible'],
        ['Estado (sistema)', HEALTH[b.health] || '—'],
        ['Nivel', b.level + ' %'],
        ['Voltaje', vv > 0 ? vv.toFixed(2) + ' V' : '—'],
        ['Temperatura', b.temp > -50 ? b.temp + ' °C' : '—'],
        ['Tecnología', b.tech || '—']
      ];
      $('#bk').innerHTML = rows.map(r => '<span>' + r[0] + '</span><span>' + esc(r[1]) + '</span>').join('');
      if (est || !h) {
        $('#bsrc').innerHTML = '<p class="mut" style="margin-top:12px;font-size:13px;line-height:19px">Este equipo no comparte su medición interna de batería con otras apps, así que calculamos la capacidad a partir de la carga actual. Si en los ajustes de tu celular aparece la salud de la batería, ese valor es el más exacto.' + (b.level < 50 ? ' La estimación mejora con más de 50 % de carga.' : '') + '</p><button class="b sec" id="bset">Ver batería en Ajustes</button>';
        $('#bset').onclick = () => call('openSettings', 'battery');
      }
      const v = batteryVerdict(b);
      ready(v.st, v.note, v.level);
    }, 60);
  }, { auto: true });
}

// Puerto de carga
function tCharge(t){
  if (!APP) {
    return step(t, '<div class="big" id="bl">—</div><p class="mut" id="bs"></p><p>Conecta o desconecta el cargador. Si detectamos el cambio, la prueba pasa sola.</p>', fin => {
      if (!navigator.getBattery) { $('#bs').textContent = 'Conecta el cargador y responde si el equipo indica que carga.'; return; }
      let b = null;
      const upd = start => () => { $('#bl').textContent = Math.round(b.level * 100) + '%'; $('#bs').textContent = b.charging ? '⚡ Cargando' : 'Sin cargar'; if (b.charging !== start) setTimeout(() => fin('ok', 'Puerto responde'), 700); };
      let h;
      navigator.getBattery().then(x => { b = x; h = upd(b.charging); h(); b.addEventListener('chargingchange', h); });
      return () => { if (b && h) b.removeEventListener('chargingchange', h); };
    });
  }
  return step(t, '<div class="big" id="bl">—</div><p class="mut" id="bs"></p><p id="bi"></p><div class="vals" id="bv"></div>', fin => {
    const b0 = callJ('batteryInfo') || {};
    let wasPlugged = b0.plugged > 0, sawUnplug = !wasPlugged, timer = 0;
    $('#bi').innerHTML = wasPlugged ? '<b>Desconecta el cargador</b> y vuelve a conectarlo.' : '<b>Conecta el cargador</b> (o ponlo en una base inalámbrica).';
    const show = b => {
      $('#bl').textContent = b.level + '%';

function playWebTone(){
  try {
    const ac = playWebTone.ac = playWebTone.ac || new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    [523, 659, 784, 1047, 784, 1047].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      const s = ac.currentTime + i * 0.22;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.6, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.2);
      o.start(s); o.stop(s + 0.21);
    });
  } catch (e) { toast('No se pudo reproducir audio'); }
}

      const loop = () => { an.getByteTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; } if (!feed(Math.min(1, Math.sqrt(s / buf.length) * 6))) raf = requestAnimationFrame(loop); };

  });
}

function avail(t){ if (!t.need) return true; const r = t.need(); return r === true ? true : r; }

async function runTest(t){
  const a = avail(t);
  if (a !== true) return { st: 'na', note: a };
  try { return await t.run(t); } catch (e) { return { st: 'fail', note: 'Error: ' + e.message }; }
}

async function runFull(){
  S.R = {}; S.runId = Date.now(); S.saved = false;
  S.ctx = { full: true, i: 0, total: T.length };
  for (let i = 0; i < T.length; i++) {
    if (!S.ctx) return;               // salió al inicio
    S.ctx.i = i;
    const r = await runTest(T[i]);
    if (!S.ctx) return;
    if (r) S.R[T[i].id] = r;
  }
  S.ctx = null;
  results();
}

async function runOne(t){
  if (!S.runId) { S.runId = Date.now(); S.saved = false; }
  S.ctx = { full: false, i: 0, total: 1 };
  const r = await runTest(t);
  S.ctx = null;
  if (r) { S.R[t.id] = r; S.saved = false; }
  grid();
}

/* ---------- calificación e informe ---------- */
const done = () => T.filter(t => S.R[t.id]);
function grade(){
  const d = done(), fails = d.filter(t => S.R[t.id].st === 'fail'), crit = fails.some(t => t.crit);
  const ok = d.filter(t => S.R[t.id].st === 'ok').length;
  const score = ok + fails.length ? Math.round(ok / (ok + fails.length) * 100) : 0;
  if (!fails.length) return ['A', 'Excelente estado', 'Todo lo que probamos funciona correctamente.', score];
  if (fails.length <= 2 && !crit) return ['B', 'Buen estado con detalles', 'Tiene fallas menores que se pueden reparar.', score];
  return ['C', 'Requiere reparación', 'Encontramos fallas importantes que conviene revisar pronto.', score];
}
function devLine(){
  const i = S.info;
  if (!APP) return (S.model || 'Equipo sin identificar') + (i.release ? ' · Android ' + i.release : '');
  return S.model + ' (' + i.model + ') · Android ' + i.release + ' · ' + ramLabel(i.ramTotal) + ' RAM · ' + storLabel(i.storTotal);
}
function report(){
  const g = grade(), d = done();
  const lines = ['📱 Diagnóstico MiVibra', 'Equipo: ' + devLine()];
  if (S.imei) lines.push('IMEI: ' + S.imei);
  if (S.bat && S.bat.healthPct) lines.push('Batería: ' + healthText(S.bat) + ' de capacidad · ' + HSRC[S.bat.healthSrc] + (S.bat.cycles > 0 ? ', ' + S.bat.cycles + ' ciclos' : ''));
  lines.push('Fecha: ' + fmtDate(S.runId || Date.now()));
  lines.push('Resultado: Categoría ' + g[0] + ' · ' + g[3] + '% de pruebas OK', '');
  const sym = { ok:'✔', fail:'✘', skip:'–', na:'·' };
  d.forEach(t => { const r = S.R[t.id]; lines.push(sym[r.st] + ' ' + t.name + (r.st === 'skip' ? ' (omitida)' : r.st === 'na' ? ' (no aplica)' : '') + (r.note && r.st !== 'skip' ? ': ' + r.note : '')); });
  return lines.join('\n');
}
function saveHistory(){
  if (S.saved || !done().length) return;
  const g = grade();
  const e = { id: S.runId, name: S.model || 'Equipo', grade: g[0], score: g[3], fails: done().filter(t => S.R[t.id].st === 'fail').map(t => t.name), report: report() };
  try {
    const h = JSON.parse(localStorage.getItem('mv_hist') || '[]').filter(x => x.id !== e.id);
    h.unshift(e); localStorage.setItem('mv_hist', JSON.stringify(h.slice(0, 50)));
    S.saved = true;
  } catch (err) {}
}

function luhn(s){ if (!/^\d{15}$/.test(s)) return false; let sum = 0; for (let i = 0; i < 15; i++) { let d = +s[14 - i]; if (i % 2) { d *= 2; if (d > 9) d -= 9; } sum += d; } return sum % 10 === 0; }

function grid(){
  setPage('grid');
  const f = S.filter || 'all';
  const st = t => S.R[t.id] ? S.R[t.id].st : 'todo';
  const show = t => f === 'all' || (f === 'todo' && !S.R[t.id]) || (f === 'fail' && st(t) === 'fail');
  const nTodo = T.filter(t => !S.R[t.id]).length, nFail = T.filter(t => st(t) === 'fail').length;
  const LBL = { ok:'OK', fail:'Falla', na:'No aplica', skip:'Omitida', todo:'Probar' };
  const cats = [...new Set(T.map(t => t.cat))];

      vis.map(t => '<button class="tr" data-t="' + t.id + '"><span class="d ' + st(t) + '"></span><span class="n">' + t.name + '</span><span class="stp ' + st(t) + '">' + LBL[st(t)] + '</span></button>').join('') + '</div>';

/* ---------- OPTIMIZAR ---------- */
const fmtB = b => { b = Math.max(0, b || 0); return b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' GB' : b >= 1048576 ? Math.round(b / 1048576) + ' MB' : Math.round(b / 1024) + ' KB'; };
const THERMAL = { 0:'Normal', 1:'Leve', 2:'Moderado', 3:'Grave', 4:'Crítico', 5:'Emergencia', 6:'Apagado' };
function tempOf(s){ return s.cpuTemp > 0 ? s.cpuTemp : s.temp; }
function tempState(t){ return t >= 45 ? ['Muy caliente', '#F87171'] : t >= 41 ? ['Caliente', '#FBBF24'] : t >= 37 ? ['Tibio', '#FF9A4D'] : ['Normal', '#4ADE80']; }
function meterRow(label, val, pct, col){
  return '<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>' + label + '</span><span class="mono" style="color:var(--txt2)">' + val + '</span></div>' +
    '<u style="display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;text-decoration:none"><i style="display:block;height:100%;width:' + Math.round(pct) + '%;background:' + col + ';border-radius:3px"></i></u></div>';
}
function toolPage(title, eyebrow){
  setPage('tool:' + title);
  return '<div class="fade">' + topBar(title) + (eyebrow ? '<p class="mut" style="margin:-4px 0 14px">' + eyebrow + '</p>' : '');
}
function bindBack(){ $('#bk').onclick = S.page.startsWith('tool') ? optimize : home; }
function permCard(title, text, btn, action){
  return '<div class="card" style="border-color:rgba(255,105,0,.35)"><b style="display:block;margin-bottom:6px">' + title + '</b><p style="font-size:14px;margin-bottom:4px">' + text + '</p><button class="b" id="permbtn">' + btn + '</button></div>';
}

function optimize(){
  setPage('opt');
  if (!APP) {
    stage.innerHTML = '<div class="fade">' + topBar('Optimizar') + '<div class="card"><p style="margin:0">Las herramientas de optimización (memoria, caché, archivos basura, apps sin usar y temperatura) funcionan solo en la app MiVibra para Android.</p></div></div>';
    bindBack(); return;
  }
  const s = callJ('sysStatus') || {};
  const ramUsed = s.ramTotal ? (s.ramTotal - s.ramAvail) / s.ramTotal * 100 : 0;
  const stoUsed = s.storTotal ? (s.storTotal - s.storFree) / s.storTotal * 100 : 0;
  const tp = tempOf(s), ts = tempState(tp);
  const col = p => p >= 90 ? '#F87171' : p >= 75 ? '#FBBF24' : '#FF6900';
  const tools = [
    ['ram', 'Liberar memoria RAM', fmtB(s.ramAvail) + ' libres de ' + ramLabel(s.ramTotal), 'chip'],
    ['cache', 'Limpiar caché de apps', 'Archivos temporales que las apps vuelven a crear', 'broom'],
    ['junk', 'Archivos basura', 'Temporales, registros, miniaturas e instaladores', 'trash'],
    ['large', 'Archivos grandes', 'Videos y archivos de más de 100 MB', 'file'],
    ['apps', 'Apps sin usar', 'Apps que no abres hace más de 30 días', 'grid'],
    ['cool', 'Temperatura y enfriamiento', ts[0] + ' · ' + tp + ' °C', 'thermo'],
    ['tips', 'Revisión de rendimiento', 'Ajustes que vuelven lento el equipo', 'gauge']
  ];
  stage.innerHTML = '<div class="fade">' + topBar('Optimizar') +
    '<div class="card" style="display:flex;flex-direction:column;gap:14px">' +
      meterRow('Memoria RAM en uso', Math.round(ramUsed) + ' %', ramUsed, col(ramUsed)) +
      meterRow('Almacenamiento usado', fmtB(s.storTotal - s.storFree) + ' / ' + storLabel(s.storTotal), stoUsed, col(stoUsed)) +
      meterRow('Temperatura', tp + ' °C · ' + ts[0], Math.min(100, Math.max(0, (tp - 20) / 30 * 100)), ts[1]) +
    '</div>' +
    '<nav class="list">' + tools.map(x => '<button class="row" data-tool="' + x[0] + '"><span class="ic">' + icon(x[3], '#FF9A4D') + '</span><span class="tx"><b>' + x[1] + '</b><span>' + esc(x[2]) + '</span></span>' + icon('chev', '#A39C94', 18) + '</button>').join('') + '</nav></div>';
  bindBack();
  stage.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => TOOLS[b.dataset.tool]());
}

/* Liberar RAM */
function toolRam(){
  const s = callJ('sysStatus') || {};
  const used = (s.ramTotal - s.ramAvail) / s.ramTotal * 100;
  stage.innerHTML = toolPage('Memoria RAM') +
    '<div style="display:flex;justify-content:center;margin:6px 0 16px" id="rr">' + ringSvg(used, 180, 12, used >= 85 ? '#F87171' : '#FF6900', '<span class="n" style="font-size:44px">' + Math.round(used) + '<small style="font-size:20px">%</small></span><span class="l">en uso</span>', 'RAM en uso') + '</div>' +
    '<div class="tiles"><div class="tile"><span>Libre</span><b>' + fmtB(s.ramAvail) + '</b></div><div class="tile"><span>Total</span><b>' + ramLabel(s.ramTotal) + '</b></div></div>' +
    '<button class="b" id="go" style="margin-top:16px">Liberar memoria</button><div id="out"></div>' +
    (s.sdk >= 34 ? '<p class="mut" style="margin-top:14px;font-size:13px;line-height:19px">En Android 14 o superior el sistema no deja que otras apps cierren procesos: él mismo libera memoria cuando hace falta. Si el equipo va lento, cierra las apps desde la vista de Recientes.</p>' : '') + '</div>';
  bindBack();
  $('#go').onclick = () => { $('#go').disabled = true; $('#go').textContent = 'Liberando…'; $('#out').innerHTML = '<div class="spin"></div>'; call('ramBoost'); };
  S.offs.push(on('boost', d => {
    $('#go').disabled = false; $('#go').textContent = 'Liberar otra vez';
    if (d.err) { $('#out').innerHTML = '<div class="verdict fail"><span class="vi">' + icon('close', '#2A0606', 16, 3) + '</span><span><b>No se pudo liberar</b><small>' + esc(d.err) + '</small></span></div>'; return; }
    const freed = d.after - d.before;
    $('#out').innerHTML = '<div class="verdict ' + (freed > 20971520 ? 'ok' : 'na') + ' fade"><span class="vi">' + icon(freed > 20971520 ? 'check' : 'close', '#06210F', 16, 3) + '</span><span><b>' + (freed > 20971520 ? 'Se liberaron ' + fmtB(freed) : 'La memoria ya estaba optimizada') + '</b><small>Ahora hay ' + fmtB(d.after) + ' libres' + (d.limited ? ' · el sistema administra el resto' : ' · se cerraron procesos en segundo plano') + '</small></span></div>';
  }));
}

      '<div class="tiles" style="margin-top:0"><div class="tile"><span>Espacio libre</span><b>' + fmtB(st.storFree) + '</b></div><div class="tile"><span>Total</span><b>' + storLabel(st.storTotal) + '</b></div></div>' +
      (needPerm ? '<div style="margin-top:14px">' + permCard('Permiso necesario', 'Android pide que actives “Acceso a todos los archivos” para MiVibra antes de limpiar la caché de las demás apps.', 'Dar permiso') + '</div>'
        : '<button class="b" id="go" style="margin-top:16px">Limpiar caché de todas las apps</button>') +
      '<div id="out"></div>' + (st.sdk < 30 ? '<p class="mut" style="margin-top:12px;font-size:13px">En esta versión de Android la limpieza se hace desde Ajustes → Almacenamiento → Datos en caché.</p>' : '') + '</div>';
    bindBack();
    const pb = q('#permbtn'); if (pb) pb.onclick = () => call('requestAllFiles');
    const go = q('#go');
    if (go) go.onclick = () => {
      const r = call('clearCache');
      if (r === 'needperm') return render();
      if (r === 'dialog') { go.disabled = true; go.textContent = 'Confirma en la ventana del sistema…'; }
      if (r === 'settings') $('#out').innerHTML = '<p class="mut" style="margin-top:12px">Abrimos los ajustes de almacenamiento: toca “Datos en caché” para limpiarla.</p>';
    };
  };
  render();
  S.onResume = render;
  S.offs.push(on('cache', d => {
    const go = q('#go'); if (go) { go.disabled = false; go.textContent = 'Limpiar otra vez'; }
    if (d.err) { $('#out').innerHTML = '<p class="mut" style="margin-top:12px">No se pudo abrir la limpieza del sistema: ' + esc(d.err) + '</p>'; return; }
    $('#out').innerHTML = '<div class="verdict ' + (d.ok ? 'ok' : 'na') + ' fade"><span class="vi">' + icon(d.ok ? 'check' : 'close', '#06210F', 16, 3) + '</span><span><b>' + (d.ok ? (d.freed > 1048576 ? 'Se liberaron ' + fmtB(d.freed) : 'Caché limpia') : 'Limpieza cancelada') + '</b><small>' + (d.ok ? 'Las apps pueden tardar un poco más en abrir la primera vez.' : 'No se borró nada.') + '</small></span></div>';
  }));
}

/* Escaneo compartido: archivos basura y grandes */
function needFilesPerm(render, what){
  stage.innerHTML += permCard('Permiso necesario', 'Para ' + what + ' MiVibra necesita “Acceso a todos los archivos”. Solo se usa para analizar y borrar lo que tú elijas; nada sale del celular.', 'Dar permiso');
  $('#permbtn').onclick = () => call('requestAllFiles');
  S.onResume = render;
}
function startScan(after){
  (S.scanOffs || []).forEach(f => f());
  S.scanOffs = [on('scan', d => { const e = q('#sc'); if (e) e.textContent = d.n.toLocaleString('es-CO') + ' archivos revisados'; }),
                on('junk', d => { S.scan = d; S.scanAt = Date.now(); after(); })];
  S.offs.push(() => (S.scanOffs || []).forEach(f => f()));
  $('#out').innerHTML = '<div class="spin"></div><p class="mut mono" style="text-align:center" id="sc">Analizando…</p>';
  call('junkScan');
}
function toolJunk(){
  const render = () => {
    const st = callJ('sysStatus') || {};
    stage.innerHTML = toolPage('Archivos basura', 'Busca archivos que se pueden borrar sin perder nada importante.');
    bindBack();
    if (!st.allFiles) return needFilesPerm(render, 'buscar archivos basura');
    S.onResume = null;
    stage.firstElementChild.insertAdjacentHTML('beforeend', '<div id="out"></div>');
    const show = () => {
      const d = S.scan;
      if (!d || d.needperm) return render();
      if (d.err) { $('#out').innerHTML = '<p class="mut">Error al analizar: ' + esc(d.err) + '</p>'; return; }
      const cats = [
        ['tmp', 'Temporales y registros', '.tmp, .log y similares que dejan las apps'],
        ['thumbs', 'Miniaturas de galería', 'Vistas previas; la galería las vuelve a crear'],
        ['apks', 'Instaladores (APK)', 'Archivos de instalación que ya no hacen falta'],
        ['empty', 'Carpetas vacías', 'Carpetas sin ningún archivo']
      ];
      const total = cats.reduce((a, c) => a + (d[c[0]] ? d[c[0]].b : 0), 0);
      $('#out').innerHTML = '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span><span class="mut" style="display:block;font-size:12.5px">Se puede liberar</span><b style="font-family:var(--fb);font-size:30px">' + fmtB(total) + '</b></span><span class="mono mut" style="font-size:11.5px;text-align:right">' + d.scanned.toLocaleString('es-CO') + ' archivos<br>' + (d.ms / 1000).toFixed(1) + ' s</span></div>' +
        '<div class="tl">' + cats.map(c => { const x = d[c[0]] || { n: 0, b: 0 }; return '<label class="tr" style="margin:0"><input type="checkbox" data-c="' + c[0] + '"' + (x.n ? ' checked' : ' disabled') + ' style="width:20px;height:20px;margin:0;accent-color:#FF6900"><span class="n">' + c[1] + '<small style="display:block;color:var(--mut);font-size:12px">' + c[2] + '</small></span><span class="mono" style="font-size:12.5px;color:var(--txt2);text-align:right;white-space:nowrap">' + (c[0] === 'empty' ? x.n : fmtB(x.b)) + '<small style="display:block;color:var(--mut)">' + (c[0] === 'empty' ? 'carpetas' : x.n + ' arch.') + '</small></span></label>'; }).join('') + '</div>' +
        (d.apkNames && d.apkNames.length ? '<details style="margin-top:10px"><summary>Ver instaladores encontrados</summary><div class="vals">' + esc(d.apkNames.join('\n')) + '</div></details>' : '') +
        '<button class="b" id="del" style="margin-top:14px">Eliminar seleccionados</button><button class="lnk" id="rescan">Analizar de nuevo</button>';
      $('#rescan').onclick = () => startScan(show);
      $('#del').onclick = () => {
        const sel = [...stage.querySelectorAll('[data-c]:checked')].map(x => x.dataset.c);
        if (!sel.length) return toast('Selecciona al menos una categoría');
        if (!confirm('¿Eliminar los archivos seleccionados? No se puede deshacer.')) return;
        $('#del').disabled = true; $('#del').textContent = 'Eliminando…';
        call('junkClean', sel.join(','));
      };
    };
    S.offs.push(on('clean', r => {
      if (r.large) return;
      $('#out').innerHTML = '<div class="verdict ok fade"><span class="vi">' + icon('check', '#06210F', 16, 3) + '</span><span><b>Se liberaron ' + fmtB(r.b) + '</b><small>' + r.n + ' elementos eliminados</small></span></div><button class="b sec" id="again2">Analizar de nuevo</button>';
      S.scan = null; $('#again2').onclick = () => startScan(show);
    }));
    if (S.scan && Date.now() - S.scanAt < 120000 && !S.scan.needperm) show(); else startScan(show);
  };
  render();
}
function toolLarge(){
  const render = () => {
    const st = callJ('sysStatus') || {};
    stage.innerHTML = toolPage('Archivos grandes', 'Archivos de más de 100 MB. Revisa antes de borrar: pueden ser videos o copias que quieras conservar.');
    bindBack();
    if (!st.allFiles) return needFilesPerm(render, 'buscar archivos grandes');
    S.onResume = null;
    stage.firstElementChild.insertAdjacentHTML('beforeend', '<div id="out"></div>');
    const show = () => {
      const d = S.scan;
      if (!d || d.needperm) return render();
      const L = d.large || [];
      if (!L.length) { $('#out').innerHTML = '<div class="card"><p style="margin:0">No hay archivos de más de 100 MB.</p></div>'; return; }
      const total = L.reduce((a, x) => a + x.s, 0);
      $('#out').innerHTML = '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span><span class="mut" style="display:block;font-size:12.5px">' + L.length + ' archivos ocupan</span><b style="font-family:var(--fb);font-size:30px">' + fmtB(total) + '</b></span></div>' +
        '<div class="tl">' + L.map((x, k) => { const parts = x.p.split('/'); const name = parts.pop(); return '<label class="tr" style="margin:0"><input type="checkbox" data-k="' + k + '" style="width:20px;height:20px;margin:0;accent-color:#FF6900"><span class="n" style="min-width:0;overflow-wrap:anywhere">' + esc(name) + '<small style="display:block;color:var(--mut);font-size:11.5px" class="mono">' + esc(parts.join('/') || '/') + ' · ' + new Date(x.m).toLocaleDateString('es-CO') + '</small></span><span class="mono" style="font-size:12.5px;color:var(--txt2);white-space:nowrap">' + fmtB(x.s) + '</span></label>'; }).join('') + '</div>' +
        '<button class="b" id="del" style="margin-top:14px">Eliminar seleccionados</button>';
      $('#del').onclick = () => {
        const sel = [...stage.querySelectorAll('[data-k]:checked')].map(x => x.dataset.k);
        if (!sel.length) return toast('Selecciona los archivos que quieres borrar');
        if (!confirm('¿Eliminar ' + sel.length + ' archivo(s)? No se puede deshacer.')) return;
        $('#del').disabled = true; $('#del').textContent = 'Eliminando…';
        call('deleteLarge', sel.join(','));
      };
    };
    S.offs.push(on('clean', r => {
      if (!r.large) return;
      toast('Se liberaron ' + fmtB(r.b));
      S.scan = null; startScan(show);
    }));
    if (S.scan && Date.now() - S.scanAt < 120000 && !S.scan.needperm) show(); else startScan(show);
  };
  render();
}

/* Apps sin usar */
function toolApps(){
  let tab = 'unused', data = null;
  const DAY = 86400000;
  const daysOf = a => a.last > 0 ? Math.floor((Date.now() - a.last) / DAY) : (a.inst ? Math.floor((Date.now() - a.inst) / DAY) : 999);
  const draw = () => {
    if (!data) return;
    if (!data.usage) {
      stage.innerHTML = toolPage('Apps') + permCard('Permiso necesario', 'Para saber cuándo usaste cada app por última vez, activa “Acceso a datos de uso” para MiVibra.', 'Dar permiso') + '</div>';
      bindBack(); $('#permbtn').onclick = () => call('openSettings', 'usage'); S.onResume = load; return;
    }
    S.onResume = load;
    const apps = data.apps || [];
    const unused = apps.filter(a => daysOf(a) >= 30).sort((a, b) => daysOf(b) - daysOf(a));
    const heavy = apps.filter(a => a.size).sort((a, b) => b.size - a.size).slice(0, 25);
    const list = tab === 'unused' ? unused : heavy;
    const unusedSize = unused.reduce((s, a) => s + (a.size || 0), 0);
    stage.innerHTML = toolPage('Apps') +
      '<div class="filters"><button class="chipb' + (tab === 'unused' ? ' on' : '') + '" data-tab="unused">Sin usar · ' + unused.length + '</button><button class="chipb' + (tab === 'heavy' ? ' on' : '') + '" data-tab="heavy">Más pesadas</button></div>' +
      (tab === 'unused' && unused.length ? '<p class="mut" style="margin:10px 0">Desinstalar estas apps liberaría unos <b style="color:#fff">' + fmtB(unusedSize) + '</b> y reduce procesos en segundo plano.</p>' : '') +
      (list.length ? '<div class="tl" style="margin-top:8px">' + list.map(a => {
        const d = daysOf(a);
        const sub = tab === 'unused' ? (a.last > 0 ? 'Sin abrir hace ' + d + ' días' : 'No se ha abierto recientemente') : 'Caché ' + fmtB(a.cache);
        return '<div class="tr" style="cursor:default">' + (a.icon ? '<img src="data:image/png;base64,' + a.icon + '" width="36" height="36" alt="" style="border-radius:9px;flex-shrink:0">' : '<span style="width:36px;height:36px;border-radius:9px;background:var(--card2);flex-shrink:0"></span>') + '<button class="n" data-info="' + esc(a.pkg) + '" style="background:none;border:0;color:var(--txt);text-align:left;font-size:14.5px;cursor:pointer;min-width:0">' + esc(a.name) + '<small style="display:block;color:var(--mut);font-size:12px">' + sub + (a.size ? ' · ' + fmtB(a.size) : '') + '</small></button><button class="chipb" data-un="' + esc(a.pkg) + '" style="padding:7px 12px;min-height:36px;font-size:12.5px">Desinstalar</button></div>';
      }).join('') + '</div>' : '<div class="card" style="margin-top:12px"><p style="margin:0">' + (tab === 'unused' ? 'Usas todas tus apps con frecuencia.' : 'Sin datos de tamaño.') + '</p></div>') + '</div>';
    bindBack();
    stage.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
    stage.querySelectorAll('[data-un]').forEach(b => b.onclick = () => call('uninstall', b.dataset.un));
    stage.querySelectorAll('[data-info]').forEach(b => b.onclick = () => call('openAppInfo', b.dataset.info));
  };
  const load = () => {
    stage.innerHTML = toolPage('Apps') + '<div class="spin"></div><p class="mut" style="text-align:center">Revisando apps instaladas…</p></div>';
    bindBack();
    call('appsScan');
  };
  setPage('tool:Apps');
  S.offs.push(on('apps', d => { data = d; draw(); }));
  load();
}

/* Temperatura y enfriamiento */
function toolCool(){
  const hist = [];
  const draw = () => {
    const s = callJ('sysStatus') || {};
    const t = tempOf(s), ts = tempState(t);
    if (!hist.length) hist.push(t);
    hist.push(t); if (hist.length > 40) hist.shift();
    const mn = Math.min(...hist) - 1, mx = Math.max(...hist) + 1;
    const pts = hist.map((v, k) => (k * (320 / (hist.length - 1))).toFixed(1) + ',' + (60 - (v - mn) / (mx - mn) * 56).toFixed(1)).join(' ');
    const big = q('#tbig');
    if (!big) return;
    big.innerHTML = '<span style="font-family:var(--fb);font-weight:800;font-size:56px;line-height:1;color:' + ts[1] + '">' + t + '<small style="font-size:24px;color:var(--mut)"> °C</small></span>';
    $('#tst').innerHTML = '<b style="color:' + ts[1] + '">' + ts[0] + '</b>' + (s.thermal != null ? ' · estado térmico del sistema: ' + THERMAL[s.thermal] : '') + (s.cpuTemp > 0 ? ' · procesador' : ' · batería');
    $('#tsp').innerHTML = '<svg width="100%" height="64" viewBox="0 0 320 64" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + ts[1] + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
    $('#tinfo').innerHTML = '<span>Batería</span><span>' + s.temp + ' °C</span>' + (s.cpuTemp > 0 ? '<span>Procesador</span><span>' + s.cpuTemp + ' °C</span>' : '') + (s.headroom != null ? '<span>Margen antes de limitar</span><span>' + Math.max(0, Math.round((1 - s.headroom) * 100)) + ' %</span>' : '') + '<span>Ahorro de batería</span><span>' + (s.saver ? 'Activado' : 'Desactivado') + '</span><span>Cargando</span><span>' + (s.plugged ? 'Sí' : 'No') + '</span>';
    S.cool = s;
  };
  stage.innerHTML = toolPage('Temperatura') +
    '<div style="display:flex;flex-direction:column;align-items:center;margin:4px 0 6px"><div id="tbig"></div><p class="mut" id="tst" style="text-align:center;margin-top:4px"></p></div>' +
    '<div class="card" style="padding:12px 14px"><span class="mut mono" style="font-size:11px">EN VIVO · CADA 2 SEGUNDOS</span><div id="tsp" style="margin-top:6px"></div></div>' +
    '<div class="card"><div class="kv" id="tinfo"></div></div>' +
    '<h3>Enfriar el equipo</h3><nav class="list">' +
      '<button class="row" id="c1"><span class="ic">' + icon('chip', '#FF9A4D') + '</span><span class="tx"><b>Cerrar apps en segundo plano</b><span>Reduce el trabajo del procesador</span></span>' + icon('chev', '#A39C94', 18) + '</button>' +
      '<button class="row" id="c2"><span class="ic">' + icon('Pantalla', '#FF9A4D') + '</span><span class="tx"><b>Bajar el brillo al 30 %</b><span>La pantalla es la que más calor genera</span></span>' + icon('chev', '#A39C94', 18) + '</button>' +
      '<button class="row" id="c3"><span class="ic">' + icon('Batería', '#FF9A4D') + '</span><span class="tx"><b>Activar ahorro de batería</b><span>Limita el rendimiento máximo</span></span>' + icon('chev', '#A39C94', 18) + '</button>' +
    '</nav><div class="card"><b style="display:block;margin-bottom:8px">Consejos</b><p style="font-size:14px;margin:0">Quita la funda mientras carga · No lo uses para juegos o video mientras carga · Evita dejarlo al sol o en el carro · Usa el cargador original · Si se calienta en reposo, revisa “Apps” por alguna que trabaje en segundo plano.</p></div></div>';
  bindBack();
  $('#c1').onclick = () => { call('ramBoost'); toast('Cerrando apps en segundo plano…'); };
  $('#c2').onclick = () => { if (call('setSystemBrightness', 30)) toast('Brillo al 30 %'); else { toast('Permite a MiVibra modificar ajustes del sistema'); call('openSettings', 'write'); } };
  $('#c3').onclick = () => call('openSettings', 'saver');
  S.offs.push(on('boost', d => { if (!d.err) toast(d.limited ? 'Listo · Android administra el resto' : 'Listo · ' + fmtB(Math.max(0, d.after - d.before)) + ' liberados'); }));
  draw();
  const iv = setInterval(draw, 2000);
  S.offs.push(() => clearInterval(iv));
}

/* Revisión de rendimiento */
function toolTips(){
  const s = callJ('sysStatus') || {}, i = S.info;
  const sto = (s.storTotal - s.storFree) / s.storTotal * 100, ram = (s.ramTotal - s.ramAvail) / s.ramTotal * 100;
  const checks = [
    [sto < 85, 'Espacio de almacenamiento', sto < 85 ? Math.round(sto) + ' % usado' : Math.round(sto) + ' % usado: con poco espacio el equipo se vuelve lento', 'junk', 'Liberar espacio'],
    [ram < 85, 'Memoria RAM', Math.round(ram) + ' % en uso', 'ram', 'Liberar RAM'],
    [(i.uptimeH || 0) < 72, 'Reinicio reciente', 'Encendido hace ' + (i.uptimeH || 0) + ' h' + ((i.uptimeH || 0) >= 72 ? ': reiniciar limpia la memoria y procesos atascados' : ''), null, null],
    [s.anim == null || s.anim <= 0.5, 'Velocidad de animaciones', s.anim == null ? 'Sin datos' : 'Escala ' + s.anim + 'x' + (s.anim > 0.5 ? ': bajarla a 0.5x hace que todo se sienta más rápido' : ''), 'dev', 'Ajustar'],
    [tempOf(s) < 41, 'Temperatura', tempOf(s) + ' °C', 'cool', 'Enfriar'],
    [!s.saver, 'Ahorro de batería', s.saver ? 'Activado: limita el rendimiento' : 'Desactivado', 'saver', 'Ajustes']
  ];
  const okN = checks.filter(c => c[0]).length;
  stage.innerHTML = toolPage('Rendimiento') +
    '<div class="card" style="display:flex;align-items:center;gap:14px"><span class="gsq ' + (okN >= 5 ? 'A' : okN >= 3 ? 'B' : 'C') + '" style="width:52px;height:52px;font-size:24px">' + okN + '/' + checks.length + '</span><span><b style="display:block">' + (okN === checks.length ? 'Todo en orden' : (checks.length - okN) + ' punto' + (checks.length - okN > 1 ? 's' : '') + ' por mejorar') + '</b><span class="mut">Revisión de lo que más afecta la velocidad</span></span></div>' +
    '<div class="tl">' + checks.map((c, k) => '<div class="tr" style="cursor:default;align-items:flex-start"><span class="d ' + (c[0] ? 'ok' : 'fail') + '" style="margin-top:7px"></span><span class="n">' + c[1] + '<small style="display:block;color:var(--mut);font-size:12.5px">' + esc(c[2]) + '</small></span>' + (!c[0] && c[3] ? '<button class="chipb" data-k="' + k + '" style="padding:7px 12px;min-height:36px;font-size:12.5px;white-space:nowrap">' + c[4] + '</button>' : '') + '</div>').join('') + '</div></div>';
  bindBack();
  stage.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const a = checks[+b.dataset.k][3];
    if (TOOLS[a]) TOOLS[a](); else call('openSettings', a);
  });
}

const TOOLS = { ram: toolRam, cache: toolCache, junk: toolJunk, large: toolLarge, apps: toolApps, cool: toolCool, tips: toolTips };

/* ---------- botón atrás de Android ---------- */
window.__back = () => {
  if (S.cancel) {
    if (S.ctx && S.ctx.full) { if (confirm('¿Salir del diagnóstico completo?')) { const c = S.cancel; S.ctx = null; c(); home(); } return true; }
    S.cancel(); return true;
  }
  if (S.page === 'histItem') { history(); return true; }
  if (S.page.startsWith('tool')) { optimize(); return true; }
  if (S.page !== 'home') { home(); return true; }
  return false;
};

on('app', d => { if (d.s === 'resume' && S.onResume) S.onResume(); });
loadDevice().then(home);
</script>
</body>
</html>
