<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3A3D40">
<title>Enviar fotos a la TV · MiVibra</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 700px at 30% -10%, #5A5E62, #46494D 45%, #323538); color: #F4F5F6; font: 16px/1.5 system-ui, -apple-system, Roboto, sans-serif; padding: 24px 18px 48px; }
  header { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
  header img { width: 30px; height: 30px; }
  h1 { font-size: 26px; line-height: 1.15; margin: 22px 0 6px; }
  p { color: rgba(255,255,255,.72); margin: 0 0 16px; }
  label.pick { display: block; text-align: center; padding: 17px; border-radius: 40px; background: #F4F5F6; color: #2A2C2E; font-weight: 800; font-size: 18px; margin-top: 8px; }
  input[type=file] { display: none; }
  .grid { margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .it { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .it img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .it .bar { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 5px; border-radius: 5px; background: rgba(0,0,0,.4); overflow: hidden; }
  .it .bar i { display: block; height: 100%; width: 0; background: #F4F5F6; transition: width .2s; }
  .it.ok .bar i { background: #22C55E; width: 100%; }
  .it.err .bar i { background: #FF7A6B; width: 100%; }
  .st { margin-top: 16px; font-weight: 700; text-align: center; }
  .tip { font-size: 13px; color: rgba(255,255,255,.55); margin-top: 18px; }
</style>
</head>
<body>
<header><img src="/isotipo.svg" alt="">MiVibra</header>
<h1>Enviar fotos a la TV</h1>
<p>Elige las fotos de tu celular: aparecen en la sección Fotos y en el marco del Inicio de MiVibra TV.</p>
<label class="pick" for="f">Elegir fotos</label>
<input id="f" type="file" accept="image/*" multiple>
<div class="st" id="st"></div>
<div class="grid" id="grid"></div>
<p class="tip">Mantén esta página abierta hasta que terminen de enviarse. El celular y la TV deben estar en el mismo Wi-Fi.</p>
<script>
/* Clave de vinculación con la TV: viene en el código QR (?k=…); si falta o cambió, se pide la que muestra la TV. */
var MVK = (function () { var q = new URLSearchParams(location.search).get('k'); try { if (q) localStorage.setItem('mvk:' + location.host, q); return q || localStorage.getItem('mvk:' + location.host) || ''; } catch (e) { return q || ''; } })();
function mvAskKey(msg) {
  var k = prompt((msg ? msg + '\n\n' : '') + 'Escribe la clave de 6 números que aparece en la TV (junto al código QR):');
  if (!k) return; k = k.replace(/\D/g, '');
  try { localStorage.setItem('mvk:' + location.host, k); } catch (e) {}
  var u = new URL(location.href); u.searchParams.set('k', k); location.replace(u.toString());
}
fetch('/auth?k=' + encodeURIComponent(MVK), { cache: 'no-store' }).then(function (r) { if (r.status === 401) mvAskKey(MVK ? 'La clave no coincide con la de la TV.' : 'Para conectar este celular con la TV hace falta su clave.'); }).catch(function () {});
(function () {
  var $ = function (id) { return document.getElementById(id); }, queue = [], busy = false, sent = 0, failed = 0;
  $('f').addEventListener('change', function () {
    Array.prototype.forEach.call(this.files, function (f) {
      var it = document.createElement('div'); it.className = 'it';
      var im = document.createElement('img'); im.src = URL.createObjectURL(f); it.appendChild(im);
      it.insertAdjacentHTML('beforeend', '<div class="bar"><i></i></div>');
      $('grid').appendChild(it);
      queue.push({ f: f, el: it });
    });
    this.value = ''; next();
  });
  function status() { var left = queue.length + (busy ? 1 : 0); $('st').textContent = left ? 'Enviando… quedan ' + left : (sent ? '¡Listo! ' + sent + (sent === 1 ? ' foto enviada' : ' fotos enviadas') + ' a la TV' : '') + (failed ? ' · ' + failed + ' no se pudieron enviar' : ''); }
  function next() {
    if (busy) return; var it = queue.shift(); status(); if (!it) return;
    busy = true;
    var name = it.f.name || ('foto-' + Date.now() + '.' + ((it.f.type.split('/')[1]) || 'jpg'));
    var x = new XMLHttpRequest();
    x.open('POST', '/fotos/upload?name=' + encodeURIComponent(name));
    x.setRequestHeader('X-MV-Key', MVK);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    var bar = it.el.querySelector('.bar i');
    x.upload.onprogress = function (e) { if (e.lengthComputable) bar.style.width = Math.round(e.loaded * 100 / e.total) + '%'; };
    x.onload = function () {
      var ok = x.status === 200; it.el.classList.add(ok ? 'ok' : 'err'); if (ok) sent++; else failed++;
      if (x.status === 401) { busy = false; return mvAskKey('La clave no coincide con la de la TV.'); }
      busy = false; next();
    };
    x.onerror = function () { it.el.classList.add('err'); failed++; busy = false; next(); };
    x.send(it.f);
  }
})();
</script>
</body>
</html>
