<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lector</title>
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--surface2:#efece5;--text:#1d1b18;--muted:#6f6a60;
  --line:#e2ddd2;--accent:#c2552d;--accent-ink:#fff;--ok:#2f7d4f;--err:#b3261e;
  --shadow:0 6px 24px rgba(0,0,0,.08);--r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161c;--surface:#1d2028;--surface2:#262a34;--text:#ecebe7;--muted:#9a9fab;
    --line:#2f3440;--accent:#e9774b;--accent-ink:#1a0d07;--shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14161c;--surface:#1d2028;--surface2:#262a34;--text:#ecebe7;--muted:#9a9fab;
  --line:#2f3440;--accent:#e9774b;--accent-ink:#1a0d07;--shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--surface2);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;font-size:19px;display:grid;place-items:center}
.icon-btn:active{background:var(--surface2)}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{max-width:360px;width:100%;text-align:center}
.logo{font:700 30px/1 Georgia,serif;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.logo .lg{width:1.35em;height:1.35em;flex:none;margin-right:.3em;color:var(--text)}
.logobtn{display:flex;align-items:center}
.logo-big{width:96px;height:96px;margin:0 auto 6px;color:var(--text)}
.logo-big .lg{width:100%;height:100%;filter:drop-shadow(0 6px 18px rgba(255,181,71,.25))}
.login-card p{color:var(--muted)}
#loginMsg{color:var(--err);min-height:1.4em}

/* App shell */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;max-width:1100px;margin:0 auto}
.bar .logo{font-size:20px;flex:1}
.tools{max-width:1100px;margin:0 auto;padding:0 12px 10px;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;outline:0;flex:1;padding:11px 0;min-width:0}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;max-width:200px;flex:none}
.filters input{width:140px;outline:0}
.filters .on{border-color:var(--accent);color:var(--accent)}
.scan{position:absolute;inset:auto 6px 6px auto;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.switch{display:flex;align-items:center;gap:10px;margin:10px 0}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.stats{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:12px 16px 80px}
h2.sec{font-size:15px;margin:14px 0 8px;color:var(--muted);font-weight:600}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
:root{--cw:min(140px,calc((100vw - 56px) / 3))}
.row .card{flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--cw));gap:16px 12px;align-items:start;justify-content:start}
.card{border:0;background:transparent;padding:0;text-align:left;width:var(--cw);display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.cover{width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface2);position:relative;flex:none}
.card .t{min-height:2.6em;line-height:1.3}
/* ---- Piel "Bibliopub original" ---- */
html[data-skin="original"]{--sage:#A8C3B0;--sage-deep:#7BA289;--blush:#E7C3BE;--lav:#C9C2E0;--gold:#E3C9A1;--ff-display:'Cormorant Garamond',Georgia,serif;--ff-body:'Mulish',system-ui,-apple-system,sans-serif}
html[data-skin="original"] body,html[data-skin="original"] button,html[data-skin="original"] input,html[data-skin="original"] select{font-family:var(--ff-body)}
html[data-skin="original"] .logo,html[data-skin="original"] h2.sec,html[data-skin="original"] .sheet h3,html[data-skin="original"] .ph,html[data-skin="original"] #dTitle{font-family:var(--ff-display);letter-spacing:.2px}
html[data-skin="original"] .bar .logo{font-size:27px;font-weight:600}
html[data-skin="original"] .logo span{color:var(--sage-deep)}
html[data-skin="original"] h2.sec{font-size:22px;font-weight:600;color:var(--text)}
html[data-skin="original"] .btn{border-radius:999px;padding:12px 22px}
html[data-skin="original"] .btn.primary{background:var(--text);color:var(--bg)}
html[data-skin="original"] .cover{border-radius:14px}
html[data-skin="original"] .sheet{border-radius:24px 24px 0 0}
html[data-skin="original"] .search{border-radius:999px}
html[data-skin="original"] .shelfbar .chip{font-weight:600;color:var(--muted)}
html[data-skin="original"] .shelfbar .chip.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
html[data-skin="original"] #btnAdd{background:var(--sage-deep);color:#fff;border-radius:50%;width:38px;height:38px;font-size:22px}
html[data-skin="original"] .prog,html[data-skin="original"] #rSlider{accent-color:var(--sage-deep)}
html[data-skin="original"] .prog{background:var(--sage-deep)}
html[data-skin="original"] .tts-main{background:var(--sage-deep)!important;color:#fff!important}
html[data-skin="original"] .linkbtn{color:var(--sage-deep)}
/* ---- Inicio en carrusel ---- */
.logobtn{border:0;background:none;padding:0;text-align:left;flex:1;color:var(--text)}
#homeView{position:relative;display:flex;flex-direction:column;gap:16px;padding:6px 0 40px}
#homeView::before{content:"";position:absolute;top:40px;left:50%;width:340px;height:340px;margin-left:-170px;border-radius:50%;background:var(--accent);opacity:.14;filter:blur(90px);pointer-events:none;z-index:0}
#homeView>*{position:relative;z-index:1}
.hhead{display:flex;align-items:baseline;gap:8px}
.hhead h2{margin:0;flex:1;font-size:17px;font-weight:700}
.hhead .hint{margin:0}
.eyebrow{flex:1;font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--accent);text-transform:uppercase}
.flow{position:relative;height:250px;perspective:900px;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:0 -16px;overflow:hidden}
.flow .fc{position:absolute;left:50%;top:8px;width:150px;height:225px;margin-left:-75px;border-radius:16px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);box-shadow:0 16px 30px -12px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.7,.3,1),opacity .45s,box-shadow .45s;padding:0;cursor:pointer}
.flow .fc img{width:100%;height:100%;object-fit:cover;display:block}
.flow *{pointer-events:none;-webkit-user-drag:none;user-select:none}
.flow .fc{pointer-events:auto}
.flow .fc.center{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent),0 26px 60px -14px var(--accent)}
.flow .fc .prog{height:5px}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{height:6px;width:6px;border-radius:99px;background:var(--line);transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--accent)}
.nowcard{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));box-shadow:0 20px 50px -28px var(--accent)}
.nowcard .nt{font-size:18px;font-weight:700;line-height:1.2}
.nowcard .na{font-size:13px;color:var(--muted);margin-top:2px}
.nowtop{display:flex;gap:10px;align-items:flex-start}
.nowtop>div{flex:1;min-width:0}
.sqbtn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--text)}
.pbarrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}
.pbarrow .pb{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbarrow .pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#9B7BFF))}
.gobtn{height:46px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.pills{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.pill span{font-weight:500;color:var(--muted)}
.pill.hot{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.recrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.recrow::-webkit-scrollbar{display:none}
.recrow .rec{flex:none;width:var(--cw);scroll-snap-align:start;display:flex;flex-direction:column}
.recrow .rec .card{width:100%}
.rec .why{font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}
.tagchip{position:absolute;left:6px;top:6px;z-index:3;font:800 10px/1 system-ui,sans-serif;padding:4px 7px;border-radius:99px;background:rgba(0,0,0,.7);color:#fff;letter-spacing:.4px}
.emptyhome{border:1px dashed var(--line);border-radius:22px;padding:22px 18px;text-align:center;color:var(--muted)}
.libtop{display:flex;margin:4px 0 6px}
.homebtn{height:40px;padding:0 14px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
html[data-skin="original"] .hhead h2{font-family:var(--ff-display);font-size:22px;font-weight:600}
html[data-skin="original"] .nowcard .nt{font-family:var(--ff-display);font-size:23px;font-weight:600;line-height:1.05}
html[data-skin="original"] .gobtn{border-radius:999px;background:var(--text);color:var(--bg)}
html[data-skin="original"] .sqbtn{border-radius:50%}
html[data-skin="original"] .flow .fc{border-radius:14px}
html[data-skin="original"] .flow .fc.center{border-color:var(--line);box-shadow:0 26px 50px -16px rgba(59,53,47,.55)}
html[data-skin="original"] .pbarrow .pb i,html[data-skin="original"] .dots i.on{background:var(--sage-deep)}
html[data-skin="original"] .eyebrow{color:var(--sage-deep)}
html[data-skin="original"] #homeView::before{background:var(--sage);opacity:.35}
@media (prefers-reduced-motion:reduce){.flow .fc{transition:none}}
.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themecard{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:none;text-align:left}
.themecard.sel{border-color:var(--accent)}
.themecard .sw{height:46px;display:flex;align-items:flex-end;gap:4px;padding:6px}
.themecard .sw i{width:14px;height:14px;border-radius:50%;display:block}
.themecard .sw b{flex:1;height:8px;border-radius:4px;display:block;opacity:.6}
.themecard span{display:block;padding:6px 8px;font-size:12px;font-weight:600;background:var(--surface)}
html[data-font="serif"] body,html[data-font="serif"] button,html[data-font="serif"] input,html[data-font="serif"] select{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}
#careLayer{position:fixed;inset:0;pointer-events:none;z-index:9999;background:#ff8a1f;mix-blend-mode:multiply;opacity:0;transition:opacity .4s}
#uFilters label{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:99px;padding:6px 10px;font-size:13px}
#uFilters input{accent-color:var(--accent)}
.offb{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;display:grid;place-items:center;z-index:2;font:700 11px/1 system-ui}
#offBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;background:#2b2b2b;color:#fff;font-size:12.5px;padding:7px 14px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;align-items:center;gap:8px;max-width:calc(100% - 32px)}
#offBar.on{display:flex}
#offBar.mini span b{display:none}
body:has(#reader:not(.hidden)) #offBar{display:none}
#offBar i{width:8px;height:8px;border-radius:50%;background:#f0a33a;flex:none}
.srcb{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;font:700 10px/1 system-ui,sans-serif;padding:4px 6px;border-radius:6px;z-index:2;letter-spacing:.3px}
.srcb.play{background:#1a73e8}
.pdfscroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--rbg,#faf7f0)}
.pdfpage{margin:10px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);position:relative}
.pdfpage canvas{display:block;width:100%;height:100%}
.pdfpage .pn{position:absolute;right:8px;bottom:6px;font:11px system-ui,sans-serif;color:#999}
.pdfpage.speaking{outline:3px solid rgba(233,119,75,.6);outline-offset:3px}
#reader.dark .pdfpage canvas{filter:invert(.88) hue-rotate(180deg)}
#reader.dark .pdfpage{background:#1c1c1c}
#reader.sepia .pdfpage canvas{filter:sepia(.35) brightness(.97)}
#viewer{position:relative;transform-style:preserve-3d}
#flipShade{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0}
#flipSnap{position:absolute;overflow:hidden;pointer-events:none;z-index:6;visibility:hidden}
#flipFlap,#flipCast{position:absolute;pointer-events:none;display:none}
/* Apertura del libro en 3D */
#bookIntro{position:fixed;inset:0;z-index:45;perspective:1600px;perspective-origin:50% 42%;overflow:hidden;cursor:pointer;--ipaper:#f3ead6;--u:3px}
#bookIntro .bi-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(56,47,38,.97),rgba(12,10,9,.99) 72%);opacity:0}
#bookIntro .bi-st,#bookIntro .bi-bk,#bookIntro .bi-lf,#bookIntro .bi-sg,#bookIntro .bi-cv{position:absolute;transform-style:preserve-3d}
#bookIntro .bi-st{left:0;top:0;transform-origin:50% 50%}
#bookIntro .bi-bk{inset:0}
#bookIntro .bi-lf,#bookIntro .bi-sg,#bookIntro .bi-cv{transform-origin:0 50%}
#bookIntro .bi-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#bookIntro .bi-face.b{transform:rotateY(180deg)}
#bookIntro .bi-pl{position:absolute}
#bookIntro .bi-sh{position:absolute;inset:0;background:#1a120a;opacity:0;pointer-events:none}
#bookIntro .bi-full{position:absolute;top:0;bottom:0;background-color:var(--ipaper)}
#bookIntro .bi-full.R{background-image:linear-gradient(to right,rgba(60,40,10,.32),rgba(60,40,10,.07) 6%,transparent 16%,transparent 95%,rgba(60,40,10,.08))}
#bookIntro .bi-full.L{background-image:linear-gradient(to left,rgba(60,40,10,.32),rgba(60,40,10,.07) 6%,transparent 16%,transparent 95%,rgba(60,40,10,.08))}
#bookIntro .bi-tx{position:absolute;top:11%;bottom:10%;opacity:.6;background:repeating-linear-gradient(to bottom,rgba(40,30,20,.42) 0 1px,transparent 1px calc(var(--u)*2.35));-webkit-mask:linear-gradient(to right,#000 0 80%,rgba(0,0,0,.55) 92%,#000);mask:linear-gradient(to right,#000 0 80%,rgba(0,0,0,.55) 92%,#000)}
#bookIntro .R .bi-tx{left:13%;right:10%}
#bookIntro .L .bi-tx{left:10%;right:13%}
#bookIntro .bi-tx.ch{top:31%}
#bookIntro .bi-chn{position:absolute;left:0;right:0;top:15%;text-align:center;font:600 calc(var(--u)*5) 'EB Garamond',Georgia,serif;letter-spacing:.14em;color:#3a2c18;opacity:.8}
#bookIntro .bi-fol{position:absolute;bottom:4.5%;font:calc(var(--u)*2.4) 'EB Garamond',Georgia,serif;color:#3a2c18;opacity:.55}
#bookIntro .R .bi-fol{right:10%}
#bookIntro .L .bi-fol{left:10%}
#bookIntro .bi-tp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16% 14%;font-family:'EB Garamond',Georgia,serif;color:#2b241b;gap:calc(var(--u)*2.4)}
#bookIntro .bi-tp b{font-size:calc(var(--u)*6.2);font-weight:600;line-height:1.08}
#bookIntro .bi-tp i{font-size:calc(var(--u)*3.2);opacity:.75}
#bookIntro .bi-tp hr{width:38%;border:0;border-top:1px solid rgba(58,44,24,.4);margin:0}
#bookIntro .bi-board{position:absolute;inset:0;border-radius:2px 5px 5px 2px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#bookIntro .bi-out{transform:rotateY(180deg);background:#3b2a1d center/cover no-repeat;box-shadow:inset 0 0 0 2px rgba(0,0,0,.3),inset 10px 0 16px rgba(0,0,0,.45)}
#bookIntro .bi-in{background:#2a1d14;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
#bookIntro .bi-cov{background:#3b2a1d center/cover no-repeat;border-radius:2px 5px 5px 2px;box-shadow:inset 5px 0 8px rgba(0,0,0,.45),inset 9px 0 0 -7px rgba(255,255,255,.12)}
#bookIntro .bi-cov .ct{position:absolute;inset:12% 10%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#f1dcae;font:600 calc(var(--u)*6.4)/1.1 'EB Garamond',Georgia,serif;border:2px solid rgba(241,220,174,.55);outline:1px solid rgba(241,220,174,.3);outline-offset:5px;padding:8px}
#bookIntro .bi-cov .ct small{font-size:.5em;margin-top:12px;opacity:.85}
#bookIntro .bi-endp{border-radius:5px 2px 2px 5px;background:#5b1f1f;background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.08) 0 8%,transparent 9%),radial-gradient(circle at 70% 60%,rgba(0,0,0,.18) 0 10%,transparent 11%);background-size:34px 34px,46px 46px;box-shadow:inset -8px 0 14px rgba(0,0,0,.45)}
#bookIntro .bi-edge{position:absolute}
#bookIntro .bi-edge.v{background:repeating-linear-gradient(to right,#efe6cf 0 1px,#c9bb9a 1px 2px)}
#bookIntro .bi-edge.h{background:repeating-linear-gradient(to bottom,#efe6cf 0 1px,#c9bb9a 1px 2px)}
#bookIntro .bi-spn{position:absolute;background:linear-gradient(to right,#24180f,#4a3322 45%,#24180f);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 8px 0 rgba(0,0,0,.25),inset 0 -8px 0 rgba(0,0,0,.25)}
#bookIntro .bi-spn span{writing-mode:vertical-rl;transform:rotate(180deg);color:#e9d39c;font:600 calc(var(--u)*3.4) 'EB Garamond',Georgia,serif;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:82%}
#bookIntro .skip{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.04em}
#bmRibbon{position:absolute;right:2px;top:52px;width:52px;height:600px;border:0;padding:0;background:none;z-index:9;display:none;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)) drop-shadow(0 1px 1px rgba(0,0,0,.3));transform-origin:50% 0}
#bmRibbon svg{width:100%;height:100%;display:block}
#bmRibbon.on{display:block;animation:bmDrop .6s cubic-bezier(.25,1.35,.5,1)}
#bmRibbon.out{display:block;pointer-events:none;animation:bmUp .38s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes bmUp{to{transform:translateY(-104%) rotate(-1deg);opacity:.2}}
@keyframes bmDrop{0%{transform:translateY(-102%) rotate(-1.5deg);opacity:.4}70%{transform:translateY(6px) rotate(.3deg);opacity:1}100%{transform:none}}
.bmpick{display:flex;gap:10px;justify-content:space-between}
.bmpick button{flex:1;border:2px solid transparent;background:var(--surface2);border-radius:10px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text)}
.bmpick button svg{width:26px;height:104px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.bmpick button.sel{border-color:var(--accent)}
/* Pantalla completa */

async function ttsNextSection(my) {

function ttsPause() {

// Si pasas la página a mano mientras suena, la voz salta a esa página

$('rVoice').onclick = () => tts.on ? ttsStop() : ttsOpen();
$('tPlay').onclick = ttsToggle;

/* ---------- Control remoto del TV, teclado y Atrás ---------- */
const SHEETS = ['noteBox', 'aa', 'toc'];
function openSheet() { return SHEETS.map($).find(s => s && !s.classList.contains('hidden')); }

function showBar() { toggleChrome(false); const b = $('rToc') || $('rBack'); b?.focus(); }
function mvKey(e) {
  if ($('reader').classList.contains('hidden')) return false;

  }
  const bar = a && a.closest && a.closest('#rbar, #rfoot, #tts, #hlBar');

    if (a.type === 'range' && (k === 'ArrowLeft' || k === 'ArrowRight')) return false;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { moveFocus(focusables(bar), k === 'ArrowRight' ? 1 : -1); return ok(); }
