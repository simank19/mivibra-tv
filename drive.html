<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>MiVibra TV · Google Drive</title>
<style>
  body{font:16px system-ui,sans-serif;background:#141210;color:#F3EFEA;margin:0;padding:24px;max-width:560px}
  h1{font-size:22px} p{color:#cfc7bd;line-height:1.5}
  a{display:block;text-align:center;padding:14px;border-radius:12px;background:#FF6900;color:#fff;font-weight:700;text-decoration:none;margin:14px 0}
</style>
<h1 id="t">Conectando con tu TV…</h1>
<p id="m">Un momento.</p>
<script>
  // Google vuelve aquí con el código; se lo pasamos a la TV (misma red Wi-Fi). La dirección de la TV viene en "state".
  (function () {
    var q = new URLSearchParams(location.search);
    var st = q.get('state') || '', code = q.get('code'), err = q.get('error');
    var m = /^(\d{1,3}(?:\.\d{1,3}){3}:\d{2,5})~(\d{6})$/.exec(st);
    function show(t, msg) { document.getElementById('t').textContent = t; document.getElementById('m').textContent = msg; }
    if (!m) { show('Enlace no válido', 'Vuelve a escanear el código QR que aparece en la TV.'); return; }
    var tv = 'http://' + m[1] + '/drive/code?k=' + m[2];
    var go = tv + (code ? '&code=' + encodeURIComponent(code) : '&error=' + encodeURIComponent(err || 'sin código'));
    var a = document.createElement('a'); a.href = go; a.textContent = 'Terminar en la TV';
    document.body.appendChild(a);
    show('Conectando con tu TV…', 'Si no avanza solo, toca el botón. El celular debe seguir en el mismo Wi-Fi que la TV.');
    location.replace(go);
  })();
</script>
</html>
