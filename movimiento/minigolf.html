// ---------- Cargar un hoyo ----------

  setup(c) { c.P.forEach((p, k) => { const pt = new THREE.Group(); const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.62, 5), E.mat('#c9d1dc')); sh.position.y = -0.3; const hd = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.045, 0.14), E.mat('#2b2b45')); hd.position.y = -0.61; pt.add(sh, hd); c.hold(k, 'left', pt); }); },

    if (G.phase === 'aim' || G.phase === 'walk') { const bw = toW(G.ball.p), tgt = bw.clone().addScaledVector(sd, -0.4).addScaledVector(d, -0.04); tgt.y = K * (G.ball.p.y - BR);

window.MG = { G, shoot: (p) => shoot(ctx, p), go: (ci) => { G.ci = ci; G.ball = null; return startHole(ctx); } };   // para pruebas y videos

// ---------- Turnos ----------
function tot(k) { return G.strokes[k].reduce((a, b) => a + (b || 0), 0); }
function hud(c) { const k = G.turn, n = G.strokes[k][G.ci] || 0;
  let h = ''; for (let j = 0; j < G.np; j++) h += c.ui.pl(j, tot(j));
  c.ui.score(h + `<span class="tag">Hoyo ${G.ci + 1}/${G.course.holes.length} · par ${G.par}</span><span class="tag">Juega ${c.P[k].name} · golpes ${n}</span>`); }
function pickCourse(c) {
  return new Promise((ok) => {
    const items = COURSES.map((co) => ({ id: co.id, label: co.name + (best[co.id] ? ' · récord ' + best[co.id] : ''), icon: co.id === 'all' ? '🏆' : '⛳' }));
    items.push({ id: 'back', label: 'Volver', icon: '↩' });
    MVHand.menu({ kicker: 'MINIGOLF', title: 'Elige el recorrido', sub: 'Cada jugador juega el hoyo completo y luego el siguiente.', items, back: 'back', onPick: (id) => ok(id === 'back' ? null : COURSES.find((x) => x.id === id)) });
  });
}
async function startHole(c) {

  c.P.forEach((p) => { p.av.scene.visible = false; });
  await setHole(c, ORDER[holeNo()]); G.turn = 0; G.phase = 'intro'; G.footY = K * (G.H.start.p[1]);
  c.ui.big('Hoyo ' + (G.ci + 1), 'Par ' + G.par + ' · ' + c.P[0].name + ' empieza', 2200);
  setTimeout(() => beginTurn(c), 2600);
}
function beginTurn(c) {

  const st = new THREE.Vector3().fromArray(G.H.start.p); st.y += BR;

  for (let i = 0; i < 40; i++) G.ph.step(G.ball, DT); G.ball.moving = false; G.ball.v.set(0, 0, 0); G.ball.last = G.ball.p.clone();
  c.say(k, '¡Tu turno!', true);
  if (G.np > 1) c.ui.big('Turno de ' + p.name, '', 1100); nextShot(c);
  const d = dirOf(G.base), sd = new THREE.Vector3().crossVectors(d, new THREE.Vector3(0, 1, 0)).normalize();
  p.av.scene.position.copy(toW(G.ball.p)).addScaledVector(sd, -0.4); p.av.scene.position.y = K * (G.ball.p.y - BR); p.av.scene.rotation.y = Math.atan2(sd.x, sd.z);
}
function baseDir() {
  const p = G.ball.p, z = zoneDir(p), g = G.field.grad(p);
  // mira hacia donde el camino baja al hoyo (o la dirección de la zona de cámara del hoyo)
  return angOf(g || z || G.ph.hp.clone().sub(p).setY(0).normalize());
}
function nextShot(c) {
  const k = G.turn, p = c.P[k]; G.phase = 'aim'; G.base = baseDir(); G.aim = 0; G.pow = p.cpu ? 0.25 : 0; G.charging = false; G.drag = null; G.cpu = null; hud(c);
  if (p.cpu) { G.cpuT = rnd(0.8, 1.4); G.cpu = { done: false, i: 0, best: null }; }
  else c.ui.cue(p.name + ': ' + (c.camOf(k) ? 'balancea los brazos como con un putter (inclínate para apuntar)' : c.TOUCH ? 'arrastra hacia abajo para la fuerza (a los lados apunta) y suelta' : '← → apuntar · mantén OK para la fuerza y suelta'), true, 3500);
  c.ui.keys(p.cpu ? '' : '← → apuntar · mantén OK: fuerza · suelta: pegar');
}
function shoot(c, pow) {
  if (G.phase !== 'aim') return; G.phase = 'roll'; G.rollT = 0; c.ui.meter(null); dots.count = 0; arrow.visible = ring.visible = false;
  const k = G.turn; G.strokes[k][G.ci]++; hud(c); G.ball.last = G.ball.p.clone();
  G.ball.v.copy(dirOf(G.base + G.aim)).multiplyScalar(speedOf(clamp(pow, 0.02, 1))); G.ball.moving = true; G.ball.slow = 0;
  c.sfx.play('click'); c.sfx.play('swing', 0.4);
  if (pow > 0.85) { const q = toW(G.ball.p); c.FX.pop(q.x, q.y + 1, q.z, '¡FIUU!', '#00E5FF', 0.5); }
}
function placeBall(dt) {
  if (!G.ball) { ballM.visible = false; return; } ballM.visible = !G.ball.gone; ballM.position.copy(G.ball.p);
  const v = G.ball.v, sp = v.length(); if (sp > 0.01) { const ax = new THREE.Vector3(v.z, 0, -v.x).normalize(); ballM.rotateOnWorldAxis(ax, sp * dt / BR); }
  const show = G.phase === 'aim'; arrow.visible = ring.visible = show && !G.ball.gone;
  if (show) { const L = 0.5 + G.pow * 3; arrow.position.copy(G.ball.p).add(new THREE.Vector3(0, -BR + 0.02, 0)); arrow.rotation.y = G.base + G.aim; arrow.userData.sh.scale.y = L; arrow.userData.sh.position.z = 0.25 + L / 2; arrow.userData.hd.position.z = 0.35 + L;
    arrow.userData.am.color.setHSL(0.33 - G.pow * 0.33, 0.9, 0.55); ring.position.copy(G.ball.p).add(new THREE.Vector3(0, -BR + 0.015, 0)); }
}
// vista previa del tiro (sin las plataformas que se mueven); más corta en difícil
function preview(c) {
  const p = c.P[G.turn]; if (p.cpu) { dots.count = 0; return; }
  const B = { p: G.ball.p.clone(), v: dirOf(G.base + G.aim).multiplyScalar(speedOf(Math.max(0.1, G.pow || 0.3))), moving: true, slow: 0 }, d = new THREE.Object3D();
  const show = [12, 8, 4][c.lvl]; let n = 0;
  for (let i = 0; i < 12 && n < show; i++) { for (let j = 0; j < 8; j++) { G.ph.step(B, DT, { preview: true }); if (!B.moving || B.inHole || B.oob) break; } d.position.copy(B.p).y -= BR * 0.6; d.scale.setScalar(1 - i / 16); d.updateMatrix(); dots.setMatrixAt(n++, d.matrix); if (!B.moving || B.inHole || B.oob) break; }
  dots.count = n; dots.instanceMatrix.needsUpdate = true;
}
// la máquina prueba muchos tiros (pocos por cuadro para no trabar el TV) y escoge el que deja la bola más cerca por el camino.
// En hoyos con barras o plataformas que se mueven, también prueba cuándo tirar (simula el movimiento real).
function cpuThink(c) {
  const C = G.cpu, MV = G.H.movers.length;
  if (!C.list) { C.list = []; C.Tb = G.t + 2; const a0 = G.base, ag = G.field.grad(G.ball.p), as = [a0, a0 + 0.1, a0 - 0.1, a0 + 0.25, a0 - 0.25, a0 + 0.45, a0 - 0.45];
    if (ag) as.push(angOf(ag)); as.push(angOf(G.ph.hp.clone().sub(G.ball.p).setY(0).normalize())); for (let i = 1; i < 12; i++) as.push(a0 + i * Math.PI / 6);
    const waits = MV ? [0, 0.6, 1.2, 1.8, 2.4, 3.0, 3.6] : [0], use = MV ? as.filter((_, i) => i < 3 || i > 6) : as;
    for (const w of waits) for (const a of use) for (let pw = 0.06; pw <= 0.95; pw += MV ? 0.12 : 0.07) C.list.push([a, pw, w]); }
  const t0 = performance.now();
  while (C.i < C.list.length && performance.now() - t0 < 7) { const [a, pw, w] = C.list[C.i++];
    const B = { p: G.ball.p.clone(), v: dirOf(a).multiplyScalar(speedOf(pw)), moving: true, slow: 0 }; let t = 0, k = 0;
    for (; t < (MV ? 7 : 10) && B.moving && !B.inHole && !B.oob; t += DT) { if (MV && k++ % 2 === 0) { animateMovers(G.H.movers, C.Tb + w + t); G.H.movers.forEach((o) => o.updateMatrixWorld(true)); G.ph.updateDyn(DT * 2); } G.ph.step(B, DT, { preview: !MV }); }
    const sc = B.inHole ? -1 - (1 - pw) : B.oob ? 999 : G.field.at(B.p) + pw * 0.2; if (!C.best || sc < C.best[0]) C.best = [sc, a, pw, w]; }
  if (MV) { animateMovers(G.H.movers, G.t); G.H.movers.forEach((o) => o.updateMatrixWorld(true)); G.ph.updateDyn(0); }
  if (C.i >= C.list.length) { const err = 1.3 - c.lvlK(); C.done = true; C.aim = C.best[1] - G.base + rnd(-1, 1) * 0.1 * err; C.pow = clamp(C.best[2] * (1 + rnd(-1, 1) * 0.18 * err), 0.04, 1);
    if (MV) { const L = G.H.movers[0].userData.mv.length || 4; C.at = C.Tb + C.best[3]; while (C.at < G.t + 0.6) C.at += L; } }
}
function stopped(c) { G.phase = 'wait'; G.ball.v.set(0, 0, 0); G.ball.moving = false; setTimeout(() => afterShot(c), 450); }
function out(c) {
  G.phase = 'wait'; G.ball.gone = true; const q = toW(G.ball.p); c.sfx.play('caida'); c.FX.pop(q.x, q.y + 1, q.z, G.ball.water ? '¡SPLASH!' : '¡AFUERA!', '#00E5FF', 0.7);
  c.ui.cue('Vuelve a tirar desde donde estabas', false, 2000);
  setTimeout(() => { G.ball.p.copy(G.ball.last); G.ball.v.set(0, 0, 0); G.ball.oob = false; G.ball.gone = false; G.ball.moving = false; afterShot(c); }, 1300);
}
function afterShot(c) { const k = G.turn;
  // si la máquina se queda dando vueltas en el mismo sitio (rizos, saltos con barras), se rinde en ese hoyo
  if (c.P[k].cpu) { const h = (G.cpuHist ||= []); h.push(G.field.at(G.ball.p)); if (h.length >= 3 && Math.max(...h.slice(-3)) - Math.min(...h.slice(-3)) < 1.2) { c.ui.cue('MiVibra no pudo con este hoyo · ' + MAXS + ' golpes'); G.strokes[k][G.ci] = MAXS; hud(c); return setTimeout(() => endTurn(c), 1200); } }
  if (G.strokes[k][G.ci] >= MAXS) { c.ui.cue('Máximo de ' + MAXS + ' golpes en este hoyo'); G.strokes[k][G.ci] = MAXS + 1; hud(c); return setTimeout(() => endTurn(c), 900); }
  G.phase = 'walk'; setTimeout(() => nextShot(c), 700); }
function holed(c) {
  G.phase = 'in'; G.ball.gone = true; const k = G.turn, n = G.strokes[k][G.ci], par = G.par, q = toW(G.ph.hp);
  c.sfx.play('hoyo'); const word = n === 1 ? '¡HOYO EN UNO!' : n <= par - 2 ? '¡ÁGUILA!' : n < par ? '¡BIRDIE!' : n === par ? '¡PAR!' : '¡ADENTRO!';
  c.FX.pop(q.x, q.y + 1.2, q.z, word, n <= par ? '#FFE600' : '#00E5FF', n === 1 ? 1.1 : 0.8); c.FX.confetti([q.x, q.y + 2, q.z], n < par, 1.5); c.FX.stars([q.x, q.y + 0.2, q.z], 7);
  if (n === 1) { c.FX.slow(0.8, 0.3); c.FX.fireworks([q.x, q.y, q.z - 4], 5, 4, 5); c.FX.flash('#FFE600', 0.3); } c.crowd(n <= par ? 'ole' : 'aplausos');
  if (!c.P[k].cpu) c.say(k, word, true);
  setTimeout(() => endTurn(c), 2000);
}
function endTurn(c) {
  G.ball = null;
  if (G.turn < G.np - 1) { G.turn++; return beginTurn(c); }
  if (G.ci < G.course.holes.length - 1) { G.ci++; return startHole(c); }
  // fin del recorrido: todos aparecen junto al hoyo
  const tots = [...Array(G.np).keys()].map(tot), m = Math.min(...tots), w = tots.indexOf(m), q = toW(G.ph.hp);
  c.P.forEach((p, j) => { p.av.scene.visible = j < G.np; p.av.scene.position.set(q.x + (j - (G.np - 1) / 2) * 0.9, q.y, q.z + 1.2); }); G.footY = q.y;
  if (!c.P[0].cpu || G.np === 2) { const mine = tots[0]; if (!best[G.course.id] || mine < best[G.course.id]) { best[G.course.id] = mine; try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} } }
  const tie = tots.filter((x) => x === m).length > 1;
  c.end(w, tie ? '¡Empate!' : c.P[w].cpu ? 'Gana MiVibra' : '¡Gana ' + c.P[w].name + '!', tots.join(' – ') + ' golpes');
}
