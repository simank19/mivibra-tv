<!DOCTYPE html>
<html lang="es">
<head>

<title>Mi personaje · MiVibra Movimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ac:#FF6A3D;--bg1:#1d2026;--bg2:#2b2f36;--line:rgba(255,255,255,.14);--mut:#aeb4bc}

#stage{position:fixed;left:0;top:0;bottom:0;right:min(520px,42vw)}

#hdr{position:fixed;left:26px;top:20px;display:flex;align-items:center;gap:12px}

.mv.on{background:#fff;color:#1c1e22}
#panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,42vw);display:grid;grid-template-columns:104px 1fr;background:linear-gradient(180deg,rgba(24,26,30,.92),rgba(18,19,22,.96));border-left:1px solid var(--line)}
#cats{display:flex;flex-direction:column;gap:6px;padding:18px 10px;border-right:1px solid var(--line)}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;border:2px solid transparent;background:transparent;color:var(--mut);font:800 11.5px Manrope,sans-serif;cursor:pointer;letter-spacing:.02em}
.cat svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat.on{background:rgba(255,106,61,.14);color:#fff}

.card.txt{align-items:center;justify-content:center;aspect-ratio:auto;min-height:74px}
.card.txt span{background:none;padding:10px;text-align:center}
.card.on{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,106,61,.35)}

.card.on .chk{display:flex}

.btn.pri{grid-column:1/3;background:var(--ac);color:#1b0f0a}
.f:focus{outline:none}
.f:focus-visible,.f.kf{outline:none;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ac)!important}

  .grid{grid-template-columns:repeat(4,1fr)}#foot{grid-template-columns:1fr 1fr 1fr}.btn.pri{grid-column:auto}
}
</style>
</head>

    if (IN_APP) { btn.textContent = 'Guardando…'; await parentSave(encodeAnime(R), R.name); toast('<b>¡Personaje guardado en tu cuenta!</b> Te sigue al TV, al celular y al PC.', 4500); }
    else toast('<b>¡Personaje guardado!</b> Ya aparece en los juegos de este equipo.');
  } catch (e) { toast('No se pudo guardar: ' + e.message, 5000); }
  btn.disabled = false; btn.textContent = old;
};
$('back').onclick = () => { if (IN_APP) window.parent.postMessage({ mv: 'close' }, '*'); else history.back(); };

// ---------- Inicio ----------
paintMoves();
window.MVAN = { set: async (o) => { if (o.cuerpo && o.cuerpo !== R.cuerpo) await setBody(o.cuerpo); R = fixAnime(Object.assign({}, R, o)); render(); await rebuild(); }, cat: (c) => { CAT = c; render(); }, move: (m) => { MOVE = m; paintMoves(); av && av.anim && av.anim.play(CLIP[m], { fade: 0 }); }, yaw: (v) => { yaw = v; idleT = -1e9; } };
(async () => {
  const acc = await fromApp(); let r = acc && acc.vrm ? decodeAnime(acc.vrm) : null;
  if (!r) { const s = await readLocal(); r = s && s.vrm ? decodeAnime(s.vrm) : null; }
  if (r) R = r;
  IDX = await animeIndex(R.cuerpo);
  render(); await rebuild(); refocus('.cat.on');
  window.MVAN.ready = true;
})();
</script>
