  requestAnimationFrame(loop);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.paused) dt = 0;
  const rdt = dt; dt = FXC.time(dt);
  G.t += dt;
  if (av) {
    const ax = G.state === 'aim' || G.state === 'swing' || G.state === 'menu' ? G.aimX : (av.scene.position.x);
    let z = 3.2, p = Object.assign({}, P_HOLD, { sp: Math.sin(now / 450) * 0.03 });
    if (G.state === 'swing') {
      const t = G.t;
      if (G.relT === undefined || G.relT === null) { p = mix(P_HOLD, P_BACK, ss(0, 0.9, t)); z = lerp(3.2, 1.6, ss(0, 1.2, t)); }
      else { const u = t - G.relT; p = u < 0.35 ? mix(P_BACK, P_REL, ss(0, 0.35, u)) : mix(P_REL, P_FOLLOW, ss(0.35, 0.9, u)); z = lerp(1.6, 0.35, ss(0, 0.35, u)); if (u > 0.33 && !ball2.live && G.state === 'swing') launch(); }
      if (G.meterOn) { G.mt += dt; G.power = 0.5 - 0.5 * Math.cos(G.mt * 3.2); meter(G.power, Math.round(lerp(4.5, 9.5, G.power) * 3.6) + ' km/h', G.spin ? (G.spin > 0 ? 'Efecto →' : 'Efecto ←') : 'Recta', 'FUERZA'); }
      else if (useCamera() && G.relT == null) meter(G.power, 'Lanza hacia adelante', '', 'FUERZA DEL BRAZO');
    } else if (G.state === 'roll' || G.state === 'sweep') { p = P_FOLLOW; z = 0.35; }
    av.scene.position.set(ax, 0, z);
    // celebrando (chuza, spare o fin del juego): el avatar se voltea hacia ti y celebra contigo (o baila solo)
    G.cel = Math.max(0, (G.cel || 0) - dt); const celeb = G.cel > 0 || G.state === 'end' || G.state === 'menu';
    av.scene.rotation.y = lerp(av.scene.rotation.y, celeb ? 0.15 : Math.PI, 1 - Math.exp(-dt * 5));
    if (G.state === 'end' && G.cpuWon) { if (av.anim) { av.anim.play('Idle', { fade: 0.3 }); av.anim.update(dt); } sad(av, dt, CEL); CEL.tt = (CEL.tt || 0) - dt; if (CEL.tt <= 0) { CEL.tt = 0.11; const h = headOf(av), f = new THREE.Vector3(0, 0, 1).applyQuaternion(av.scene.getWorldQuaternion(new THREE.Quaternion())); FXC.tears([h.x, h.y, h.z], [f.x, f.y, f.z]); CEL.bu = (CEL.bu || 0.8) - 0.11; if (CEL.bu <= 0) { CEL.bu = 1.8; FXC.pop(h.x, h.y + 0.5, h.z, '¡SNIF!', '#5ec8ff', 0.55); } } }
    else if (celeb) { if (av.anim) { av.anim.play('Idle', { fade: 0.3 }); av.anim.update(dt); } celebrate(av, dt, myEJ(), CEL, facesCam(av.scene, cam)); }
    else {
      // de pie (apuntando, en el menú o mirando los pinos): animación natural + lo que hagas frente al celular
      const natural = av.anim && (G.state === 'aim' || G.state === 'menu' || G.state === 'load' || (G.state === 'sweep' && G.t > 1.2));
      if (natural) { av.anim.play('Idle', { fade: 0.35 }); av.anim.update(dt); { const e = myEJ(); if (e) e.apply(av, dt, { arms: 1, spine: 0.7, head: 1, legs: 0 }, facesCam(av.scene, cam)); } } else { if (av.anim) av.anim.stop(); resetBones(); pose(p); }
    }
    av.update(dt);
  }
  if (G.state === 'swing' && G.relT == null) G.relT = G.relT; // espera el lanzamiento
  if (G.state === 'swing' && G.relT !== undefined && G.relT !== null && !ball2.live && G.t - G.relT > 0.6) launch();
  // bola: en la mano hasta lanzarla
  if (!ball2.live && av && (G.state === 'aim' || G.state === 'swing' || G.state === 'menu')) { av.scene.updateMatrixWorld(true); av.humanoid.getRawBoneNode('rightHand').getWorldPosition(tmp); ball.position.copy(tmp); ball.position.y -= 0.06; ball.visible = true; }
  if (ball2.live || G.state === 'roll') {
    const sub = 4; for (let i = 0; i < sub; i++) physics(dt / sub);
    ball.position.set(ball2.x, ball2.y, ball2.z); ball.rotation.x -= ball2.vz * dt / BR; ball.visible = ball2.z > -19.8;
    if (ball2.live && ball.visible) { const fire = (G.power || 0) > 0.85; FX.trail(ball2.x, ball2.y, ball2.z + 0.08, fire); if (fire || Q > 0) FX.trail(ball2.x, ball2.y, ball2.z + 0.16, fire); }
    if (SND.roll) SND.rollSet(ball2.live ? 0.55 : 0);
    placePins();
    const moving = PINS.some((p) => !p.gone && Math.hypot(p.vx, p.vz) > 0.03);
    if (G.state === 'roll' && !ball2.live && (!moving || G.t > 7)) { G.state = 'settling'; setTimeout(settle, 700); }
    if (G.state === 'roll' && G.t > 9) { ball2.live = false; }
  } else { if (G.state === 'sweep' && G.t > G.sw0) pinsetter(G.t - G.sw0, G.swFull); placePins(); }
  // trayectoria prevista
  aim.visible = G.state === 'aim';
  if (aim.visible) { const pos = aimGeo.attributes.position, hk = -(G.spin || 0); for (let j = 0; j <= NSEG; j++) { const d = 0.4 + j / NSEG * 17.6, x = G.aimX + 0.18 + hk * 0.45 * Math.pow(Math.max(0, d - 7) / 11, 2) * 0.5, z = 0.15 - d, w = 0.08 + j / NSEG * 0.05; pos.setXYZ(j * 2, x - w, 0.005, z); pos.setXYZ(j * 2 + 1, x + w, 0.005, z); } pos.needsUpdate = true; aimGeo.computeBoundingSphere(); }
  if ((now | 0) % 3 === 0) stickDraw();
  camera(rdt || 0.016);
  neonTick(now); SOFA.tick(now / 1000);
  FXC.render(R, S, cam, rdt);
}

// ---------- Inicio ----------
MVLink.open((txt, ok) => { $('cst').textContent = txt; $('cst').classList.toggle('ok', !!ok); if (MVLink.code) { $('code').textContent = MVLink.code; if (!$('qr').src) $('qr').src = MVLink.qr(5); } if (ok && G.state === 'menu') { MVHand.close(); startMenu(); } });
resetPins(true); G.standing = 10; drawScore();
requestAnimationFrame(loop);
loadAvatar().then(() => { $('loading').style.display = 'none'; startMenu(); }).catch((e) => { console.error(e); $('loading').textContent = 'No se pudo cargar el avatar'; });
window.MVB = { G, PL, EJ, pinsetter, knockSome: (n) => PINS.slice(0, n).forEach((p) => { p.down = true; p.tilt = 1.5; p.x += (Math.random() - 0.5) * 0.3; }), setPlayers, ball2, PINS, settle: () => settle(), release: (p, h) => { startSwing(); release(p, h); }, pick: (id) => { MVHand.close(); menuPick(id); }, scores };
</script>
