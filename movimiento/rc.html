<!DOCTYPE html>
<html lang="es">
<head>

<title>Carreras RC · MiVibra</title>
<style>
html,body{margin:0;height:100%;background:#0D0C0B;overflow:hidden;color:#F3EFEA;font-family:'DM Sans',Manrope,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
.glass{background:rgba(13,12,11,.72);border:1px solid rgba(255,255,255,.18);border-radius:16px}
#hud{position:fixed;inset:0;pointer-events:none}
.vp{position:absolute;overflow:hidden}
.vp .pos{position:absolute;left:2%;top:3%;padding:4px 14px;display:flex;align-items:baseline;gap:4px}
.vp .pos b{font:800 clamp(28px,5.2vmin,56px)/1 'Bricolage Grotesque',sans-serif;color:#FF6900}
.vp .pos span{font:800 clamp(13px,2vmin,20px)/1 sans-serif}
.vp .lap{position:absolute;left:50%;top:3%;transform:translateX(-50%);padding:7px 14px;font:800 clamp(12px,1.9vmin,18px)/1.2 sans-serif;white-space:nowrap}
.vp .item{position:absolute;left:2%;bottom:3%;width:clamp(54px,10vmin,92px);height:clamp(54px,10vmin,92px);display:grid;place-items:center;border:2px solid #FF6900;background:rgba(42,26,14,.8)}
.vp .item svg{width:56%;height:56%}
.vp .item i{position:absolute;bottom:-1.6em;left:0;right:0;text-align:center;font:800 clamp(10px,1.6vmin,14px) sans-serif;font-style:normal;white-space:nowrap}
.vp .item.n2::after{content:'';position:absolute;right:-12px;top:-12px;width:26px;height:26px;border-radius:9px;background:#FF6900}
.vp .spd{position:absolute;right:2%;bottom:3%;padding:8px 14px;min-width:120px}
.vp .spd b{font:800 clamp(24px,4.5vmin,48px)/1 'Bricolage Grotesque',sans-serif}
.vp .spd .bar{height:9px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
.vp .spd .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00E5FF,#FF6900)}
.vp .msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:8px 18px;border-radius:14px;background:#FF2EA8;font:800 clamp(14px,2.4vmin,22px)/1.2 sans-serif;white-space:nowrap;opacity:0;transition:opacity .25s}
.vp .msg.on{opacity:1}
.vp .wrong{position:absolute;left:50%;top:40%;transform:translateX(-50%);font:800 clamp(18px,4vmin,40px) sans-serif;color:#FFE600;text-shadow:0 3px 10px #000}
.vp .name{position:absolute;right:2%;top:3%;padding:6px 12px;font:700 clamp(11px,1.7vmin,15px)/1.2 sans-serif}
#big{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:800 clamp(60px,16vmin,180px)/1 'Bricolage Grotesque',sans-serif;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6);pointer-events:none}
#mini{position:fixed;right:1.5%;top:12%;width:clamp(110px,17vmin,190px);height:clamp(110px,17vmin,190px);pointer-events:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(13,12,11,.35),rgba(13,12,11,.9));padding:3vmin;box-sizing:border-box}
#menu .card{width:min(1100px,96vw);max-height:94vh;overflow:auto;padding:clamp(16px,3vmin,32px);box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(10px,1.8vmin,18px)}
#menu small{font:700 12px/16px sans-serif;letter-spacing:.14em;color:#FF9A4D}
#menu h1{margin:0;font:800 clamp(28px,5vmin,52px)/1.05 'Bricolage Grotesque',sans-serif}
#menu h1 span{color:#FF6900}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,.05)}
.row.f{border-color:#FF6900;background:rgba(255,105,0,.14)}
.row .lb{width:130px;flex:none;font:700 14px sans-serif;color:#C9C2BA}
.row .val{flex:1;display:flex;align-items:center;gap:10px;font:800 clamp(16px,2.4vmin,22px) sans-serif}
.row .arr{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:800 18px sans-serif;flex:none}
.row .desc{font:400 13px/1.35 sans-serif;color:#A39C94;margin-left:auto;max-width:48%;text-align:right}
.go{height:58px;border-radius:16px;border:0;background:#FF6900;color:#fff;font:800 22px sans-serif}
.go.f{outline:3px solid #FFE600}
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.pl b{font-size:15px}.pl.ready{border-color:#7CFF4D}
.pl .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.join{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05)}
.join img{width:96px;height:96px;border-radius:10px;background:#fff;flex:none}
.join p{margin:0;font:400 14px/1.45 sans-serif;color:#C9C2BA}
.join b{color:#fff}

#res .r b{width:34px;font:800 24px 'Bricolage Grotesque',sans-serif;color:#FF6900}
#res .r span{margin-left:auto;color:#C9C2BA;font-weight:600}

#touch .steer{position:absolute;left:0;bottom:0;width:45%;height:60%;pointer-events:auto}
#touch .knob{position:absolute;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,105,0,.35);display:none}
#touch .hint{position:absolute;left:4%;bottom:6%;font:700 12px sans-serif;color:rgba(255,255,255,.65)}
#touch .btns{position:absolute;right:2.5%;bottom:4%;display:grid;grid-template-columns:auto auto;gap:12px;pointer-events:auto;align-items:end}
#touch button{border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#fff;font:800 14px sans-serif;touch-action:none}
#touch .gas{width:96px;height:96px;background:rgba(255,105,0,.75)}
#touch .brk,#touch .drf{width:68px;height:68px;background:rgba(13,12,11,.6)}
#touch .pw{width:72px;height:72px;background:rgba(255,46,168,.75)}
#touch button.on{transform:scale(.93);filter:brightness(1.3)}
#touch .pause{position:absolute;right:2.5%;top:2.5%;width:44px;height:44px;border-radius:12px;pointer-events:auto;background:rgba(13,12,11,.6)}

body.touch .vp .spd{right:auto;left:50%;transform:translateX(-50%);bottom:2%;min-width:0;padding:6px 12px}
body.touch .vp .item{top:16%;bottom:auto}
body.touch #mini{top:16%}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#0D0C0B;font:800 20px sans-serif;color:#C9C2BA}

    const seat = seats[k], car = seat ? seat.car : [0, 1, 2, 3].find((c) => !used.has(c) && (used.add(c), true)) ?? (k % 4);
    const r = makeRacer(k, car, seat ? PAINT[(car + k * 2) % PAINT.length] : PAINT[(car + 4) % PAINT.length], !!seat, k);
    if (seat) { r.src = seat.src; r.name = seatName(seat); }
    // parrilla: 2 x 2 detrás de la meta
    r.s = TR.L - 6 - Math.floor(k / 2) * 8; r.lap = -1; r.d = (k % 2 ? 1 : -1) * TR.W * 0.22; r.yw = frameAt(r.s).p.y; RACERS.push(r);
  }
  buildHud(); engineStart();
  $('load').classList.add('hide'); $('hud').classList.remove('hide'); $('mini').classList.toggle('hide', STATE.humans > 1); if (TOUCH) $('touch').classList.remove('hide');
  STATE.phase = 'count'; STATE.t = 0; STATE.raceT = 0;
  for (const p of MVLink.players) if (p) try { p.conn.send({ t: 'rcpad', on: true }); } catch (e) {}
}
function onLap(c) {
  if (c.lap === 0) return;   // cruzó la meta al arrancar
  if (c.lap >= STATE.laps && !c.done) { c.done = true; c.fin = STATE.raceT; c.place = RACERS.filter((r) => r.done).length; if (c.human) { say(c, c.place === 1 ? '¡Ganaste!' : 'Llegaste ' + c.place + '°'); sfxPlay(c, c.place === 1 ? 'ovacion' : 'aplausos', 0.7); }
    if (RACERS.filter((r) => r.human).every((r) => r.done)) setTimeout(endRace, 2200); return; }
  if (c.human) { const last = c.lap === STATE.laps - 1; say(c, last ? '¡Última vuelta!' : 'Vuelta ' + (c.lap + 1)); sfxPlay(c, last ? 'campana' : 'ok', 0.5); }
}
function rankOf(c) { return RACERS.slice().sort((a, b) => (b.done - a.done) || (a.done ? a.fin - b.fin : b.prog - a.prog)).indexOf(c); }
function endRace() {
  if (STATE.phase === 'result') return; STATE.phase = 'result'; engineStop();
  for (const r of RACERS) if (!r.done) { r.fin = STATE.raceT + (RACERS.length - rankOf(r)) * 0.01 + (leaderProg() - r.prog) / 25; }
  const order = RACERS.slice().sort((a, b) => (b.done - a.done) || (a.done ? a.fin - b.fin : b.prog - a.prog));
  const win = order[0];
  $('resCard').innerHTML = `<small style="font:700 12px sans-serif;letter-spacing:.14em;color:#FF9A4D">RESULTADOS · ${TRACKS[STATE.track].name.toUpperCase()}</small><h2 style="margin:0;font:800 36px 'Bricolage Grotesque',sans-serif">${win.human ? '¡Ganó ' + win.name + '!' : 'Ganó ' + win.name + ' (máquina)'}</h2>` +
    order.map((r, i) => `<div class="r"><b>${i + 1}</b>${r.human ? `<span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${PCOL[r.slot]}"></span>` : ''}${r.name} · ${r.C.name}<span>${r.done ? fmt(r.fin) : 'sin terminar'}</span></div>`).join('') +
    `<button class="go f" id="again">Volver al menú</button>`;
  $('res').classList.remove('hide'); $('again').onclick = () => showMenu();
  if (win.human) sfxPlay(win, 'ovacion', 0.8);
}
const fmt = (t) => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
function say(c, txt) { if (!c || !c.human || !c.hud) return; c.hud.msg.textContent = txt; c.hud.msg.classList.add('on'); clearTimeout(c.hud.mt); c.hud.mt = setTimeout(() => c.hud.msg.classList.remove('on'), 1600); }

// ------------------------------- HUD y vistas (pantalla dividida) -------------------------------
function views() { const n = STATE.humans; if (n <= 1) return [[0, 0, 1, 1]]; if (n === 2) return innerWidth >= innerHeight ? [[0, 0, 0.5, 1], [0.5, 0, 0.5, 1]] : [[0, 0, 1, 0.5], [0, 0.5, 1, 0.5]]; return [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]]; }
function buildHud() {
  const hud = $('hud'); hud.innerHTML = ''; const V = views();
  RACERS.filter((r) => r.human).forEach((c, k) => { const [x, y, w, h] = V[k], el = document.createElement('div'); el.className = 'vp'; Object.assign(el.style, { left: x * 100 + '%', top: y * 100 + '%', width: w * 100 + '%', height: h * 100 + '%' });
    el.innerHTML = `<div class="pos glass"><b>1</b><span>/4</span></div><div class="lap glass">Vuelta 1/${STATE.laps}</div>${STATE.humans > 1 ? `<div class="name glass" style="border-color:${PCOL[c.slot]}">${c.name}</div>` : ''}<div class="item glass"><svg viewBox="0 0 24 24" fill="none" stroke="#FFB77F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg><i></i></div><div class="spd glass"><b>0</b> <span style="font:700 12px sans-serif;color:#C9C2BA">km/h</span><div class="bar"><i></i></div></div><div class="msg"></div><div class="wrong"></div>`;
    hud.appendChild(el); c.hud = { el, pos: el.querySelector('.pos b'), lap: el.querySelector('.lap'), item: el.querySelector('.item'), ico: el.querySelector('.item svg'), itn: el.querySelector('.item i'), spd: el.querySelector('.spd b'), bar: el.querySelector('.spd .bar i'), msg: el.querySelector('.msg'), wrong: el.querySelector('.wrong') }; c.cam = new THREE.PerspectiveCamera(62, 1, 0.1, 900); c.camPos = null; c.vp = V[k]; });
  drawItems();
}
function drawItems() { for (const c of RACERS) if (c.human && c.hud) { const it = c.items[0]; c.hud.ico.innerHTML = it ? ITEMS[it].ico : ''; c.hud.itn.textContent = it ? ITEMS[it].name : ''; c.hud.item.style.opacity = it ? 1 : 0.45; c.hud.item.classList.toggle('n2', c.items.length > 1); } }
function hudTick() {
  for (const c of RACERS) if (c.human && c.hud) { c.hud.pos.textContent = rankOf(c) + 1; c.hud.lap.textContent = c.done ? 'Terminaste · ' + fmt(c.fin) : `Vuelta ${clamp(c.lap + 1, 1, STATE.laps)}/${STATE.laps} · ${fmt(STATE.raceT)}`;
    c.hud.spd.textContent = Math.round(Math.abs(c.v) * 2.2); c.hud.bar.style.width = (c.boost > 0 ? 100 : clamp(c.dch / 0.8, 0, 1) * 100) + '%'; c.hud.wrong.textContent = c.wrong > 1 ? '¡Vas al revés!' : ''; }
  if (STATE.humans <= 1 && WORLD.mm) $('miniDots').innerHTML = RACERS.map((r) => { const [x, y] = WORLD.mm(worldPos(r)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.human ? 7 : 5}" fill="${r.human ? PCOL[r.slot] : '#fff'}" stroke="#000" stroke-width="1.5"/>`; }).join('');
}

// ------------------------------- Dibujar carros y cámara -------------------------------
const _m = new THREE.Matrix4();
function worldPos(c) { const f = frameAt(c.s); return f.p.clone().addScaledVector(f.B, c.d).addScaledVector(f.N, f.loop ? 0 : c.h); }
function poseRacer(c, dt) {
  const f = frameAt(c.s), pos = f.p.clone().addScaledVector(f.B, c.d);
  if (!f.loop) pos.y = c.yw; c.box.position.copy(pos);
  c.box.quaternion.setFromRotationMatrix(_m.makeBasis(f.B, f.N, f.T.clone().negate()));
  // inclinación en el aire, derrape y giros por golpe
  c.pitch = lerp(c.pitch, c.air ? clamp(-c.vy * 0.025, -0.4, 0.4) : 0, 6 * dt); c.roll = lerp(c.roll, -c.inp.x * clamp(Math.abs(c.v) / 30, 0, 1) * 0.05 * (c.C.id === 'moto' ? 6 : 1), 6 * dt);
  c.box.rotateY(-c.psi - (c.drift ? c.drift * 0.35 : 0) + (c.spin > 0 ? c.spinVis : 0)); c.box.rotateX(c.pitch); c.box.rotateZ(c.roll + (c.stun > 0 && c.C.id === 'moto' ? 1.2 : 0));
  c.steerVis = lerp(c.steerVis, -c.inp.x * 0.45, 10 * dt);
  for (const w of c.wheels) { const sgn = w.o.rotation.y ? -1 : 1; w.o.rotation.z += sgn * c.v * dt / (w.r * (c.C.s || 1)) * -1; if (w.front) w.o.rotation.y = (w.o.rotation.y ? Math.PI : 0) + c.steerVis * (c.C.id === 'moto' ? 0.4 : 1); }
  c.sh.visible = c.shieldT > 0; c.fl.visible = c.boost > 0; if (c.fl.visible) c.fl.children.forEach((m) => { m.scale.y = rnd(0.7, 1.3); });
  // polvo/humo de las llantas
  if (!c.air && Math.abs(c.v) > 14 && Math.random() < (Q ? 0.5 : 0.2) * (TR.def.surf === 'tierra' ? 1 : c.drift ? 1 : 0.15)) puff(c.box.localToWorld(new THREE.Vector3(rnd(-1, 1), 0.3, 2)), TR.def.surf === 'tierra' ? '#c4a37f' : '#cfcfcf', 2.2, 0.8);
}
function camTick(c, dt) {
  const f = frameAt(c.s), fwd = f.T.clone().applyAxisAngle(f.N, -c.psi * 0.6), up = f.loop ? f.N : new THREE.Vector3(0, 1, 0).lerp(f.N, 0.3).normalize();
  const tgt = c.box.position.clone().addScaledVector(fwd, -8.5).addScaledVector(up, 3.6), look = c.box.position.clone().addScaledVector(fwd, 6).addScaledVector(up, 1.0);
  if (!c.camPos) { c.camPos = tgt.clone(); c.camLook = look.clone(); c.camUp = up.clone(); }
  const k = 1 - Math.exp(-dt * (f.loop ? 10 : 6)); c.camPos.lerp(tgt, k); c.camLook.lerp(look, 1 - Math.exp(-dt * 10)); c.camUp.lerp(up, k).normalize();
  // que la cámara no se meta bajo tierra
  if (!f.loop) c.camPos.y = Math.max(c.camPos.y, frameAt(c.s - 8).p.y + 1.2, 0.8);
  c.cam.position.copy(c.camPos); c.cam.up.copy(c.camUp); c.cam.lookAt(c.camLook); c.cam.fov = lerp(c.cam.fov, 62 + (c.boost > 0 ? 10 : 0) + clamp(Math.abs(c.v) - 20, 0, 15) * 0.4, 4 * dt);
}
// cámara del menú: vuelta lenta alrededor de los carros
const menuCam = new THREE.PerspectiveCamera(50, 1, 0.1, 900);

// ------------------------------- Bucle -------------------------------
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop); if (window.__hold) { last = now; return; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (STATE.phase === 'menu' || STATE.phase === 'load') { syncSeats(); }
  if (!TR) return;
  if (STATE.phase === 'count') { STATE.t += dt; const n = 3 - Math.floor(STATE.t); $('big').textContent = n > 0 ? n : '¡YA!'; if (STATE.t >= 3 && !STATE.went) { STATE.went = true; STATE.phase = 'race'; for (const c of RACERS) if (c.human) sfxPlay(c, 'silbato', 0.6); setTimeout(() => { if ($('big').textContent === '¡YA!') $('big').textContent = ''; }, 700); }
    if (Math.floor(STATE.t) !== Math.floor(STATE.t - dt) && STATE.t < 3) try { sfx.play('click', 0.6); } catch (e) {} }
  else STATE.went = STATE.phase === 'race' ? STATE.went : false;
  if (STATE.phase === 'race' || STATE.phase === 'count' || STATE.phase === 'result') {
    pollInputs();
    const steps = 2, h = dt / steps;
    if (STATE.phase !== 'pause') for (let s = 0; s < steps; s++) { for (const c of RACERS) { if (!c.human || c.done) aiDrive(c, h); physics(c, h); } collide(); }
    if (STATE.phase === 'race') STATE.raceT += dt;
    tickItems(dt, t); engineTick();
    // nadie humano corriendo → termina cuando la máquina acabe
    if (STATE.phase === 'race' && STATE.humans === 0 && RACERS.every((r) => r.done)) endRace();
  }
  if (STATE.phase === 'menu') { for (const c of RACERS) { c.inp.x = 0; c.inp.g = 0; } }
  for (const c of RACERS) poseRacer(c, dt);
  tickFX(dt); if (STATE.phase !== 'menu' && STATE.phase !== 'load') hudTick();
  // sombra que sigue al primer jugador
  const focusC = RACERS.find((r) => r.human) || RACERS[0];
  if (focusC && WORLD.sun) { const p = focusC.box.position; WORLD.sun.target.position.copy(p); WORLD.sun.position.copy(p).addScaledVector(WORLD.sunDir, 150); }
  const W = R.domElement.width, H = R.domElement.height; R.setScissorTest(true); R.clear();
  if (window.__top) { const oc = new THREE.OrthographicCamera(-95 * W / H, 95 * W / H, 95, -95, 1, 500); oc.position.set(0, 200, 0); oc.up.set(0, 0, -1); oc.lookAt(0, 0, 0); R.setViewport(0, 0, W, H); R.setScissor(0, 0, W, H); R.render(S, oc); return; }
  if (STATE.phase === 'menu' || STATE.phase === 'load' || !RACERS.some((r) => r.human)) {
    const c0 = frameAt(10).p; menuCam.position.set(c0.x + Math.cos(t * 0.15) * 22, c0.y + 7, c0.z + Math.sin(t * 0.15) * 22); menuCam.lookAt(c0.x, c0.y + 1, c0.z); menuCam.aspect = W / H; menuCam.updateProjectionMatrix();
    R.setViewport(0, 0, W, H); R.setScissor(0, 0, W, H); R.render(S, menuCam);
  } else for (const c of RACERS) if (c.human && c.cam) { camTick(c, dt); const [x, y, w, h] = c.vp, px = x * W, py = (1 - y - h) * H, pw = w * W, ph = h * H; c.cam.aspect = pw / ph; c.cam.updateProjectionMatrix(); R.setViewport(px, py, pw, ph); R.setScissor(px, py, pw, ph); R.render(S, c.cam); }
}
// ------------------------------- Inicio -------------------------------
MVLink.open(() => { if (STATE.phase === 'menu') drawMenu(); });
addEventListener('gamepadconnected', () => { if (STATE.phase === 'menu') { syncSeats(); drawMenu(); } });
// los controles Bluetooth también navegan el menú del jugador que lo tiene
let gpPrev = {};
setInterval(() => { if (STATE.phase !== 'menu' && STATE.phase !== 'result') return; const gps = navigator.getGamepads ? navigator.getGamepads() : []; let changed = false; syncSeats();
  for (let k = 0; k < gps.length; k++) { const gp = gps[k]; if (!gp) continue; const seat = SEATS.find((s) => s.src === 'pad' + k); const ax = gp.axes[0] || 0, now = { l: ax < -0.6 || gp.buttons[14]?.pressed, r: ax > 0.6 || gp.buttons[15]?.pressed, a: gp.buttons[0]?.pressed }, pv = gpPrev[k] || {};
    if (seat && performance.now() > (seat.cool || 0)) { if (now.l && !pv.l) { seat.car = (seat.car + 3) % 4; changed = true; } if (now.r && !pv.r) { seat.car = (seat.car + 1) % 4; changed = true; } if (now.a && !pv.a) { seat.ready = !seat.ready; changed = true; } }
    if (STATE.phase === 'result' && now.a && !pv.a) showMenu(); gpPrev[k] = now; }
  if (changed) drawMenu(); }, 60);
requestAnimationFrame(loop);
await previewTrack(); $('load').classList.add('hide'); showMenu();
// prueba rápida: simular segundos sin dibujar (la máquina maneja todos)
function sim(sec, h = 1 / 60) { STATE.phase = 'race'; let air = 0, hmax = 0; for (let i = 0; i < sec / h; i++) { for (const c of RACERS) { aiDrive(c, h); physics(c, h); if (c.air) air += h; hmax = Math.max(hmax, c.h); } collide(); tickItems(h, i * h); STATE.raceT += h; } return { air: +air.toFixed(1), hmax: +hmax.toFixed(1), r: RACERS.map((r) => [r.name, r.lap, r.s | 0, r.v.toFixed(1), r.done]) }; }
window.MVRC = { STATE, RACERS, TR: () => TR, startRace, SEATS, endRace, useItem, sim, TRACKS };
</script>
