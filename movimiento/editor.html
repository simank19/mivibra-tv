function toast(h, ms) { $('toast').innerHTML = h; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), ms || 3500); }
function db() { return new Promise((res, rej) => { const r = indexedDB.open('mivibra-movimiento', 1); r.onupgradeneeded = () => r.result.createObjectStore('avatar'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function saveLocal(buf, name) { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('avatar', 'readwrite'); t.objectStore('avatar').put({ vrm: buf, name, at: Date.now() }, 'me'); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function readLocal() { try { const d = await db(); return await new Promise((res) => { const t = d.transaction('avatar', 'readonly').objectStore('avatar').get('me'); t.onsuccess = () => res(t.result || null); t.onerror = () => res(null); }); } catch (e) { return null; } }
function parentSave(buf, name) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => { removeEventListener('message', on); rej(new Error('La app no respondió')); }, 60000);
    function on(e) { if (e.source !== window.parent || !e.data || e.data.mv !== 'avatar-saved') return; clearTimeout(t); removeEventListener('message', on); e.data.ok ? res() : rej(new Error(e.data.msg || 'No se pudo guardar en tu cuenta')); }
    addEventListener('message', on); window.parent.postMessage({ mv: 'avatar-save', vrm: buf, name }, '*', [buf]);
  });
}
function fromApp() {
  if (!IN_APP) return Promise.resolve(null);
  return new Promise((res) => { const t = setTimeout(() => { removeEventListener('message', on); res(null); }, 20000);
    function on(e) { if (e.source !== window.parent || !e.data || e.data.mv !== 'avatar') return; clearTimeout(t); removeEventListener('message', on); res(e.data.vrm ? e.data : null); }
    addEventListener('message', on); window.parent.postMessage({ mv: 'avatar-get' }, '*'); });
}
$('save').textContent = IN_APP ? 'Guardar en mi cuenta' : 'Guardar';
$('save').onclick = async () => {
  const btn = $('save'); btn.disabled = true; const old = btn.textContent;
  try {
    await saveLocal(encode(R), R.name);
    if (IN_APP) { btn.textContent = 'Guardando en tu cuenta…'; await parentSave(encode(R), R.name); toast('<b>¡Avatar guardado en tu cuenta!</b> Te sigue al TV, al celular y al PC.', 4500); }
    else toast('<b>¡Avatar guardado!</b> Ya aparece en los juegos de este equipo.', 3500);
  } catch (e) { toast('No se pudo guardar: ' + e.message, 5000); }
  btn.disabled = false; btn.textContent = old;
};
$('playV').onclick = () => { location.href = '../vallas/' + location.search; };
$('playB').onclick = () => { location.href = '../bolos/' + location.search; };
if (IN_APP) addEventListener('keydown', (e) => { if (e.key === 'Escape') window.parent.postMessage({ mv: 'close' }, '*'); });

// ---------- Inicio: el avatar de tu cuenta o el guardado en este equipo ----------
render(); paintPoses();
preload([R]);
window.MVED = { set: async (o) => { R = fix(Object.assign({}, R, o)); render(); await rebuild(); }, pose: (p) => { POSE = p; paintPoses(); }, yaw: (v) => { yaw = v; idleT = -1e9; }, tab: (k) => { tab = k; render(); } };
(async () => {
  const acc = await fromApp(); let r = acc && acc.vrm ? decode(acc.vrm) : null;
  if (!r) { const s = await readLocal(); r = s && s.vrm ? decode(s.vrm) : null; }
  if (r) { R = r; render(); }
  await rebuild(); focusFirst();
  if (acc && acc.vrm && !decode(acc.vrm)) toast('Tu avatar anterior era del estilo realista. Crea uno nuevo con el estilo caricatura y guárdalo.', 6000);
})();
</script>
