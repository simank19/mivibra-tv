ctx.ui.touch([{ label: '👟 Izq', key: 'ArrowLeft' }, { label: '⤒ Saltar', key: 'ArrowUp', ok: 1 }, { label: 'Der 👟', key: 'ArrowRight' }]);

function countdown(c, go) { let n = 3; c.ui.big('' + n, 'En sus marcas', 800); c.sfx.play('click');
  const cd = setInterval(() => { n--; if (n > 0) { c.ui.big('' + n, n === 2 ? 'Listos' : '', 800); c.sfx.play('click'); } else { clearInterval(cd); c.ui.big('¡YA!', '', 800); c.sfx.play('disparo'); c.crowd('ole'); go(); } }, 900); }
// cada toque alternado (izquierda/derecha) da un empujón de velocidad
function mash(R, key) { if (key === R.lastKey) { R.mash = Math.max(0, R.mash - 0.4); return; } R.lastKey = key; R.mash = Math.min(14, R.mash + 1.6); }

  G.t += dt; const now = performance.now();
  RN.forEach((R, k) => {
    if (R.done) { R.v = lerp(R.v, 1.5, 0.03); R.s += R.v * dt; return; }

    R.time += dt; R.stun -= dt;

      else { h.down = true; h.m.rotation.x = -1.4; R.stun = 0.7; c.sfx.play('golpe', p.cpu ? 0.3 : 0.8); c.FX.dust([q.x, 0, q.z], '#f0b49a', 10, 0.25); if (!p.cpu) { c.FX.shake(0.5); c.FX.pop(q.x, 2.2, q.z, '¡CRASH!', '#FF6A3D', 0.8); } } } });

      if (R.place === 1) { c.FX.confetti([q.x, 3, q.z], true, 4); c.FX.fireworks([q.x - 4, 0, q.z - 10], 6, 8, 9); c.crowd('ole'); c.FX.pop(q.x, 3, q.z, '¡META!', '#FFE600', 1.1); c.FX.slow(0.6, 0.3); } }

// ---------- Salto largo ----------

  if (early < -0.05) return landed(c, k, 0, '¡NULO!');   // pisó después de la tabla
  R.early = Math.max(0, early); G.phase = 'fly'; R.air = true; R.vx = R.v * 0.92; R.vy = 3.4 + R.v * 0.12; c.sfx.play('salto'); c.ui.meter(null);
  if (early < 0.15 && R.v > 9) { c.FX.pop(RUN.x, 2.4, RUN.boardZ, '¡PERFECTO!', '#FFE600', 0.8); c.FX.slow(0.6, 0.35); }
}
function landed(c, k, d, nulo) {
  const R = RN[k]; R.air = false; c.ui.meter(null); G.phase = 'land';
  if (nulo) { c.sfx.play('error'); c.FX.pop(RUN.x, 2, RUN.boardZ, nulo, '#FF2EA8', 0.9); G.marks[k].push(0); }
  else { c.sfx.play('caida'); c.FX.dust([RUN.x, 0.1, R.z], '#f2d49a', 16, 0.35); c.FX.ring(RUN.x, 0.1, R.z, '#ffffff', 1.6); G.mark.visible = true; G.mark.position.set(RUN.x + 0.9, 0.3, R.z);
    G.marks[k].push(d); G.best[k] = Math.max(G.best[k], d); c.FX.pop(RUN.x, 2.2, R.z, d.toFixed(2) + ' m', d > 7 ? '#FFE600' : '#00E5FF', d > 7 ? 1 : 0.8);
    if (d > 7.5) { c.FX.confetti([RUN.x, 3, R.z], true, 2); c.crowd('ole'); } else c.crowd('aplausos'); }
  hud(c);
  setTimeout(() => { if (k === 1) G.att++; G.turn = 1 - G.turn;
    if (G.att >= 3) { const w = G.best[0] >= G.best[1] ? 0 : 1; return c.end(w, c.P[w].cpu ? 'Gana MiVibra' : '¡Gana ' + c.P[w].name + '!', G.best.map((b) => b.toFixed(2) + ' m').join(' – ')); }
    jumpTurn(c); }, 2200);
}
