  frame(c, dt) {

// física sobre la pista: s = metros a lo largo, x = desvío lateral
function step(B, dt, preview) {

function placeBall() { const T = G.track; if (!T || !G.ball || G.ball.in) { ballM.visible = false; ballSh.visible = false; return; } ballM.visible = ballSh.visible = true;

function startWorld(c) { const W = WORLDS[G.world]; buildWorld(c, W); c.ui.big('Mundo ' + (G.world + 1) + ': ' + W.name, W.lv + ' · 3 hoyos', 1800); startHole(c); }
