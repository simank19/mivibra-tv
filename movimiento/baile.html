// Baile: como en las fiestas. Copia al bailarín (en espejo) siguiendo las tarjetas. Música propia MiVibra
// o tu propia canción: se detectan el ritmo (BPM) y las partes fuertes, y se arma la coreografía sola.
// Pasos: ángulo de cada brazo visto desde la persona (0 = a su derecha, 90 = arriba, 180 = a su izquierda).
const MOVES = {
  arriba: { R: 70, L: 110, key: 'ArrowUp', icon: '↑', col: '#FFE600' },

  { id: 's1', name: 'Neón Pop', bpm: 116, style: 'pop', key: 5, dance: 'disco' },
  { id: 's2', name: 'Fiesta Electro', bpm: 126, style: 'electro', key: 2, dance: 'festejo' },

const G = { song: null, beats: [], moves: [], idx: 0, t0: 0, score: [0, 0], combo: [0, 0], best: [0, 0], perfect: [0, 0], phase: 'idle', energy: 0 };

// ---------- Música MiVibra (sintetizada en vivo) ----------
function ac() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); return AC; }

// coreografía: un paso por compás (en las partes fuertes, cada 2 tiempos y pasos más difíciles)

const ctx = await startGame({

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshBasicMaterial({ map: fl })); floor.rotation.x = -Math.PI / 2; S.add(floor);

    glow = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: glowT, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); glow.position.set(0, 2.2, -4); S.add(glow);

    ringA = new THREE.Mesh(new THREE.TorusGeometry(2.45, 0.06, 6, 60), neon('#00e5ff')); ringA.rotation.x = Math.PI / 2; ringA.position.set(0, 0.31, -2.6); S.add(ringA);
    ringB = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.04, 6, 48), neon('#ff2ea8')); ringB.rotation.x = Math.PI / 2; ringB.position.set(0, 0.03, 1.6); S.add(ringB);
    const P6 = [[-0.75, 2.1], [0.75, 2.1], [-0.45, 1.1], [0.45, 1.1], [-1.3, 1.5], [1.3, 1.5]];
    pads = P6.map((p) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.02, 24), new THREE.MeshBasicMaterial({ color: '#3a2070' })); m.position.set(p[0], 0.02, p[1]); S.add(m);
      const h = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.6, 24, 1, true), new THREE.MeshBasicMaterial({ color: '#ffe600', transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide })); h.position.set(p[0], 0.82, p[1]); S.add(h); return { m, h, on: 0 }; });

    glow.material.opacity = 0.6 + pulse * 0.4 * E2; G.arcs.forEach((a, i) => { a.scale.setScalar(1 + (i === Math.floor(b) % 5 ? pulse * 0.06 : 0)); });

      p.m.material.color.set(p.on > 0.05 ? (i % 2 ? '#ff2ea8' : '#ffe600') : '#3a2070'); p.h.material.opacity = p.on * 0.18; p.h.material.color.set(i % 2 ? '#ff2ea8' : '#ffe600'); });
  },
  pose(c, k, av, dt) {
    c.clip(k, 'Idle');
    const bpm = G.song ? G.song.bpm : 110, t = G.phase === 'dance' && AC ? AC.currentTime - G.t0 : c.t;
    dance(av, Math.max(0, t), (G.song && G.song.style) || 'disco', 0.9, bpm);

  camera(c) { const sw = Math.sin(c.t * 0.25) * 0.4; return [new THREE.Vector3(1.0 + sw, 2.9, 6.6), new THREE.Vector3(-0.1, 1.1, -2.4), 2]; },
  key(c, key, ok, slot) { if (G.phase !== 'dance') return; const k = slot === 1 && !c.P[1].cpu ? 1 : 0; pressMove(c, k, key); },
  touch(c, t, k) { if (G.phase !== 'dance' || t.s !== 'swipe') return; const key = Math.abs(t.dx) > Math.abs(t.dy) ? (t.dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (t.dy < 0 ? 'ArrowUp' : 'ArrowDown'); pressMove(c, k, key); },
  photoSub: () => G.score[0] + ' puntos · racha ' + G.best[0],
  endTitle: () => '¡Qué baile!',

ctx.ui.touch([{ label: '←', key: 'ArrowLeft' }, { label: '↑', key: 'ArrowUp' }, { label: '↓', key: 'ArrowDown' }, { label: '→', key: 'ArrowRight' }]);
addEventListener('click', () => { if (AC && AC.state === 'suspended' && !ctx.paused) AC.resume(); });
setInterval(() => { if (AC && G.phase === 'dance') { if (ctx.paused && AC.state === 'running') AC.suspend(); else if (!ctx.paused && AC.state === 'suspended') AC.resume(); } }, 300);

function currentMove(t) { let m = null; for (const mv of G.moves) { if (mv.t - G.song.beat * 0.5 <= t) m = mv; else break; } return m; }
function pressMove(c, k, key) {
  if (c.P[k].cpu) return; const t = AC.currentTime - G.t0, beat = G.song.beat; G.lastKey = G.lastKey || [];
  const mv = G.moves.find((m) => !m.res[k] && Math.abs(m.t - t) < beat * 0.6); const hit = Object.keys(MOVES).find((n) => MOVES[n].key === key); if (hit) { G.lastKey[k] = hit; setTimeout(() => { if (G.lastKey[k] === hit) G.lastKey[k] = null; }, 600); }
  if (!mv) return; if (MOVES[mv.m].key !== key) return judge(c, k, mv, 0);

}
function judge(c, k, mv, q) {
  mv.res[k] = ['fallo', 'bien', 'perfecto'][q]; const el = document.getElementById('judge'), av = c.P[k].av.scene.position;
  if (q) { G.combo[k]++; G.best[k] = Math.max(G.best[k], G.combo[k]); const mult = 1 + Math.min(3, Math.floor(G.combo[k] / 5)); G.score[k] += (q === 2 ? 100 : 50) * mult; if (q === 2) G.perfect[k]++; }
  else G.combo[k] = 0;
  if (k === 0 || c.P[0].cpu) { el.textContent = ['¡UPS!', '¡BIEN!', '¡PERFECTO!'][q]; el.style.color = ['#B9B1A8', '#00E5FF', '#FFE600'][q]; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); clearTimeout(el.h); el.h = setTimeout(() => el.classList.remove('on'), 500); }
  if (q === 2) { c.FX.stars([av.x, 1.4, av.z], 5, MOVES[mv.m].col); c.FX.sparks([av.x, 1.2, av.z], 0.3, MOVES[mv.m].col); c.sfx.play('ritmo', 0.5); }
  if (q && G.combo[k] > 0 && G.combo[k] % 10 === 0) { c.FX.pop(av.x, 2.4, av.z, '¡RACHA x' + G.combo[k] + '!', '#FF2EA8', 0.8); c.FX.confetti([0, 4, 0], false, 3); c.crowd('aplausos'); c.FX.flash('#FF2EA8', 0.2); }
  if (!q && G.combo[k] >= 8) c.sfx.play('error', 0.4);
}
function drawTrack(t) {
  const box = document.getElementById('cards'), beat = G.song.beat, W = box.parentElement.clientWidth;
  const vis = G.moves.filter((m) => m.t > t - beat * 1.2 && m.t < t + beat * 8);
  box.innerHTML = vis.map((m) => { const M = MOVES[m.m], x = (0.12 + (m.t - t) / (beat * 8) * 0.88) * W, r = (a) => a * Math.PI / 180;
    // figurita: brazos en espejo (como los verás en el guía)
    const ax = (a) => (28 + Math.cos(r(a)) * 20).toFixed(0), ay = (a) => (22 - Math.sin(r(a)) * 20).toFixed(0);
    return `<div class="card${m.res[0] ? ' ok' : ''}" style="left:${x.toFixed(0)}px;--c:${M.col}"><svg viewBox="0 0 56 56"><circle cx="28" cy="10" r="6"/><path d="M28 18L28 38M28 38L20 52M28 38L36 52M28 22L${ax(M.R)} ${ay(M.R)}M28 22L${ax(M.L)} ${ay(M.L)}"/></svg><b>${M.icon}</b></div>`; }).join('');
  G.idx = G.moves.filter((m) => m.t < t).length;
}
function hud(c) { const two = !c.P[1].cpu; document.getElementById('comboN').textContent = 'x' + G.combo[0];
  c.ui.score(c.ui.pl(0, G.score[0]) + `<span class="tag">${G.song ? G.song.name : ''} · ${Math.round(G.idx / Math.max(1, G.moves.length) * 100)}%</span>` + (two ? c.ui.pl(1, G.score[1]) : '')); }
function stopMusic() { if (G.song) G.song.stop(); }
function finish(c) {
  if (G.phase !== 'dance') return; G.phase = 'done'; stopMusic(); document.getElementById('track').classList.remove('on'); document.getElementById('combo').classList.remove('on');
  const max = G.moves.length * 100 * 3, st = (k) => Math.max(1, Math.min(5, Math.ceil(G.score[k] / max * 5 * 1.6))), two = !c.P[1].cpu;
  const w = two ? (G.score[0] >= G.score[1] ? 0 : 1) : 0;
  c.end(w, two ? '¡Gana ' + c.P[w].name + '!' : '★'.repeat(st(0)) + '☆'.repeat(5 - st(0)), G.score[w] + ' puntos · ' + G.perfect[w] + ' perfectos · racha ' + G.best[w]);
}
function pickFile(c) {
  return new Promise((ok) => { const f = document.getElementById('file'); f.value = ''; c.ui.cue('Elige una canción de tu equipo (mp3, m4a, wav…)', true, 6000);
    f.onchange = async () => { const file = f.files[0]; if (!file) return ok(null); c.ui.big('Analizando…', 'Buscando el ritmo de tu canción', 4000);
      try { const s = await analyze(file); s.style = s.bpm < 105 ? 'salsa' : s.bpm < 122 ? 'disco' : 'festejo'; c.ui.cue('Ritmo: ' + Math.round(s.bpm) + ' BPM · ' + s.plan.filter((x) => x === 2).length + ' compases fuertes', false, 4000); ok(s); }
      catch (e) { c.ui.cue('No pude leer ese archivo de audio', true); ok(null); } };
    f.click(); setTimeout(() => { if (!f.files.length) { /* sigue esperando a que elija */ } }, 1000); });
}
