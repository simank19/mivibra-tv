function jump(c, k) { const R = RN[k]; if (R.air || R.stun > 0) return; R.air = true; R.vy = 7; if (!c.P[k].cpu) c.sfx.play('salto'); }
function usePow(c, k) {
  const R = RN[k], pw = R.pow; if (!pw) return; R.pow = null; const q = at(R.s, R.x).p, me = !c.P[k].cpu;
  if (pw === 'turbo') { R.boost = 2.4; c.sfx.play('poder'); if (me) { c.FX.punch(8); c.FX.pop(q.x, q.y + 2.6, q.z, '¡TURBO!', '#FFE600', 0.9); } }
  if (pw === 'escudo') { R.shield = 5; c.sfx.play('perfecto', 0.6); if (me) c.FX.pop(q.x, q.y + 2.6, q.z, '¡ESCUDO!', '#00E5FF', 0.9); }
  if (pw === 'banana') { const m = G.banM.clone(); const b = at(R.s - 1.4, R.x).p; m.position.set(b.x, b.y + 0.1, b.z); c.S.add(m); G.bananas.push({ m, s: R.s - 1.4, x: R.x, owner: k }); c.sfx.play('trampa', 0.6); if (me) c.ui.cue('¡Dejaste una cáscara atrás!'); }
  if (pw === 'rayo') { c.sfx.play('trampa'); c.FX.flash('#fff6a0', 0.5); RN.forEach((O, j) => { if (j !== k && O.shield <= 0 && !O.done) { O.slow = 2.2; const p = at(O.s, O.x).p; c.FX.sparks([p.x, p.y + 1.5, p.z], 0.8, '#fff6a0'); } }); c.FX.pop(q.x, q.y + 2.8, q.z, '¡RAYO!', '#FFF6A0', 1); }
}
function hud(c) {
  const rank = [0, 1, 2, 3].sort((a, b) => (RN[b].done ? 1e6 - RN[b].place : RN[b].s) - (RN[a].done ? 1e6 - RN[a].place : RN[a].s)), me = c.P[0].cpu && !c.P[1].cpu ? 1 : 0, pos = rank.indexOf(me) + 1, R = RN[me];
  c.ui.score(`<span class="pl"><i style="background:${c.P[me].color}"></i>${c.P[me].name}</span><span class="n">${pos}º</span><span class="tag">${Math.round(clamp(R.s / FINISH, 0, 1) * 100)}% · ${Math.round(R.v * 3.6)} km/h${R.pow ? ' · ' + POW[R.pow].icon + ' ' + POW[R.pow].name : ''}</span>`);
}
