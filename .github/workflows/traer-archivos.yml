# Herramienta: descarga archivos públicos (por ejemplo de archive.org) y los deja como artefacto para usarlos en la app.
name: Traer archivos
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Enlaces separados por espacio"
        required: true
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar
        run: |
          mkdir -p out && cd out
          i=0
          for u in ${{ github.event.inputs.urls }}; do
            i=$((i+1)); n=$(basename "${u%%\?*}"); n=$(python3 -c "import sys,urllib.parse;print(urllib.parse.unquote(sys.argv[1]))" "$n")
            curl -sSL --retry 3 -o "$i-$n" "$u" || echo "falló $u"
          done
          ls -la
      - name: Guardar en la rama "archivos" (no toca main)
        run: |
          cd out
          git init -q -b archivos
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "archivos"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" archivos
