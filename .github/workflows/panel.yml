name: Panel web de listas

# Publica en GitHub Pages la página donde cada cliente agrega su lista con el código de su TV.
# Solo lleva la configuración pública de Firebase (nada de claves secretas).
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/www/listas.html"
      - ".github/workflows/panel.yml"
      - ".github/SIN_CONTACTO"
      - "docs/drive.html"
      - "app/src/main/assets/www/**"
      - "tvweb/**"
      - "desktop/web/player.*"
      - ".github/scripts/tvpack.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el panel
        env:
          MV_FIREBASE: ${{ secrets.MV_FIREBASE }}
          MV_WHATSAPP: ${{ secrets.MV_WHATSAPP }}
        run: |
          mkdir -p site/panel
          cp app/src/main/assets/www/listas.html site/panel/index.html
          cp app/src/main/assets/www/img/isotipo.svg site/panel/isotipo.svg
          python3 - <<'PY'
          import json, os, re
          fb = os.environ.get('MV_FIREBASE', '').strip()
          cfg = {}
          if fb:
              body = fb[fb.find('{'):fb.rfind('}') + 1]
              body = re.sub(r'//[^\n]*', '', body)
              body = re.sub(r'([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:', r'\1"\2":', body)
              body = re.sub(r',\s*}', '}', body).replace("'", '"')
              cfg = json.loads(body)
          open('site/panel/config.js', 'w').write('window.MV_CONFIG = ' + json.dumps({'firebase': cfg, 'whatsapp': '' if os.path.exists('.github/SIN_CONTACTO') else os.environ.get('MV_WHATSAPP', '').strip()}) + ';\n')
          PY
          # Control del celular por internet (para los TV Samsung y LG)
          mkdir -p site/mando
          cp app/src/main/assets/www/pad.html site/mando/index.html
          cp app/src/main/assets/www/img/isotipo.svg site/mando/isotipo.svg
          cp site/panel/config.js site/mando/config.js
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=panel/">' > site/index.html
          # Página de regreso de Google al conectar Drive desde el celular
          cp docs/drive.html site/drive.html
      - name: Versión para televisores Samsung y LG (se actualizan solos desde aquí)
        run: |
          mkdir -p /tmp/tvv && cd /tmp/tvv && npm init -y >/dev/null && npm i --no-audit --no-fund hls.js@1 mpegts.js@1 pako@2
          mkdir -p "$GITHUB_WORKSPACE/build-tv-vendor"
          cp node_modules/hls.js/dist/hls.min.js node_modules/mpegts.js/dist/mpegts.js node_modules/pako/dist/pako_inflate.min.js "$GITHUB_WORKSPACE/build-tv-vendor/"
          cd "$GITHUB_WORKSPACE" && python3 .github/scripts/tvpack.py site site/tv ${{ github.run_number }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
