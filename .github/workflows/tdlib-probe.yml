name: Probar TDLib en Android
# Carga la librería de Telegram en un emulador Android y guarda el registro (para encontrar por qué se cierra)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/tdlib/probe/**', '.github/workflows/tdlib-probe.yml']
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Compilar la prueba (dex)
        run: |
          set -e
          AJ=$(ls -d $ANDROID_HOME/platforms/android-3*/android.jar | tail -1); BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          mkdir -p src/androidx/annotation cls
          echo 'package androidx.annotation; import java.lang.annotation.*; @Retention(RetentionPolicy.CLASS) public @interface IntDef { int[] value() default {}; boolean flag() default false; boolean open() default false; }' > src/androidx/annotation/IntDef.java
          echo 'package androidx.annotation; public @interface Nullable {}' > src/androidx/annotation/Nullable.java
          javac -nowarn --release 11 -cp $AJ -d cls src/androidx/annotation/*.java app/src/main/java/org/drinkless/tdlib/*.java .github/tdlib/probe/Probe.java
          (cd cls && jar cf ../probe.jar .)
          $BT/d8 --min-api 26 --lib $AJ --output . probe.jar
          ls -la classes.dex
          V=$(cat .github/tdlib/version.txt)
          curl -sL -o x.gz https://github.com/${{ github.repository }}/releases/download/tdlib-$V/libtdjni-x86_64.so.gz && gunzip -c x.gz > libtdjni.so && ls -la libtdjni.so
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb push classes.dex /data/local/tmp/probe.dex
            adb push libtdjni.so /data/local/tmp/libtdjni.so
            adb logcat -c
            adb shell "CLASSPATH=/data/local/tmp/probe.dex app_process /system/bin Probe /data/local/tmp/libtdjni.so" > out.txt 2>&1 || true
            sleep 3
            adb logcat -d > logcat.txt || true
            echo "===== salida ====="; cat out.txt
            echo "===== logcat (fallas) ====="; grep -iE "PROBE|Abort message|FATAL|F DEBUG|F libc|JNI DETECTED|tdjni|td_jni|Mismatched|UnsatisfiedLink|dlopen" logcat.txt | head -120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdlib-probe
          path: |
            out.txt
            logcat.txt
