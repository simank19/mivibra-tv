name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configurar cuenta MiVibra
        env:
          MV_FIREBASE: ${{ secrets.MV_FIREBASE }}
          MV_ADMIN_EMAIL: ${{ secrets.MV_ADMIN_EMAIL }}
          MV_GOOGLE_WEB_CLIENT: ${{ secrets.MV_GOOGLE_WEB_CLIENT }}
          MV_GOOGLE_TV_CLIENT: ${{ secrets.MV_GOOGLE_TV_CLIENT }}
          MV_GOOGLE_TV_SECRET: ${{ secrets.MV_GOOGLE_TV_SECRET }}
        run: python3 .github/scripts/config.py

      - name: Prueba gratuita (sin datos del dueño)
        shell: bash
        run: |
          if [ -f .github/PRUEBA_GRATIS ]; then
            rm -rf app/src/main/assets/www/mibiblioteca
            echo "Prueba gratuita: se quitó la biblioteca privada y la configuración de la cuenta"
          fi

      - name: Compilar
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Si falla, deja los errores como comentario del commit (fácil de revisar desde el celular)
      - name: Reportar errores
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Errores de compilación'
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILURE|Could not|Execution failed|> |Unresolved|Caused by" build.log | head -120
            echo '---'
            tail -60 build.log
            echo '```'
          } > errors.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@errors.md

      - name: Notas de la versión
        run: |
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md
          [ -s notes.md ] || echo "Mejoras y correcciones." > notes.md

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MiVibraTV-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MiVibraTV-apk
          path: out/*.apk

      # Publica la APK como "Release" para descargarla fácil desde el celular o la TV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MiVibra TV ${{ github.run_number }}
          body_path: notes.md
          files: out/*.apk
          make_latest: true

  # Versión para PC (Windows): mismo número que la APK, en la misma Release
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar cuenta MiVibra
        shell: bash
        env:
          MV_FIREBASE: ${{ secrets.MV_FIREBASE }}
          MV_ADMIN_EMAIL: ${{ secrets.MV_ADMIN_EMAIL }}
          MV_GOOGLE_WEB_CLIENT: ${{ secrets.MV_GOOGLE_WEB_CLIENT }}
          MV_GOOGLE_TV_CLIENT: ${{ secrets.MV_GOOGLE_TV_CLIENT }}
          MV_GOOGLE_TV_SECRET: ${{ secrets.MV_GOOGLE_TV_SECRET }}
        run: python .github/scripts/config.py

      - name: Prueba gratuita (sin datos del dueño)
        shell: bash
        run: |
          if [ -f .github/PRUEBA_GRATIS ]; then
            rm -rf app/src/main/assets/www/mibiblioteca
            echo "Prueba gratuita: se quitó la biblioteca privada y la configuración de la cuenta"
          fi

      # 7-Zip (abre zip, 7z y rar) va dentro del instalador
      - name: Incluir 7-Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/build/7z | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe","C:\Program Files\7-Zip\7z.dll" desktop/build/7z/

      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Emuladores (EmulatorJS)
        working-directory: desktop
        run: npm run ejs

      - name: Compilar instalador
        working-directory: desktop
        shell: bash
        env:
          MV_BUILD: ${{ github.run_number }}
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: desktop/dist/*.exe
