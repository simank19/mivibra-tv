name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MiVibraTV-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MiVibraTV-apk
          path: out/*.apk

      # Publica la APK como "Release" para descargarla fácil desde el celular o la TV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MiVibra TV ${{ github.run_number }}
          body: APK lista para instalar en Android TV, celular y tablet.
          files: out/*.apk
          make_latest: true
